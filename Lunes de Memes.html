    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #000;
        }
        .media-container {
            height: 100vh;
            width: 100vw;
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            overflow-x: hidden;
        }
        .media-item {
            height: 100vh;
            width: 100vw;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video, img {
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
        }
        .media-container::-webkit-scrollbar { display: none; }
        .media-container { -ms-overflow-style: none; scrollbar-width: none; }
        .overlay-content { text-shadow: 1px 1px 3px rgba(0,0,0,0.5); }

        .interactive-ui {
            transition: opacity 0.4s ease-in-out;
        }
        .interactive-ui.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        /* --- Barra de Progreso --- */
        .progress-bar-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 0 1rem 1rem 1rem;
            box-sizing: border-box;
        }
        input[type="range"].progress-bar {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            outline: none;
            cursor: pointer;
        }
        input[type="range"].progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
        }

        /* --- Control de Volumen --- */
        .volume-control-container {
            position: relative;
        }
        .volume-slider {
            display: none;
            position: absolute;
            bottom: 45px; /* Encima del icono */
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            padding: 10px 5px;
        }
        .volume-control-container:hover .volume-slider {
            display: block;
        }
        input[type="range"].volume-bar {
            -webkit-appearance: none;
            background: transparent;
            cursor: pointer;
            width: 100px; /* Ancho del contenedor vertical */
        }
        input[type="range"].volume-bar:focus { outline: none; }
        /* Escritura vertical */
        input[type="range"].volume-bar {
            writing-mode: bt-lr; /* IE */
            -webkit-appearance: slider-vertical; /* WebKit */
        }

    </style>
</head>

        const mediaData = usersData.flatMap(user =>
            user.media.map(item => ({...item, user: user.user, profilePic: user.profilePic }))
        );

        const mediaFeed = document.getElementById('media-feed');
        const unmuteOverlay = document.getElementById('unmute-overlay');
        let hideUITimer = null;

        mediaData.forEach(data => {
            const mediaItem = document.createElement('div');
            mediaItem.className = 'media-item';

            let mediaElement;
            if (data.type === 'video') {
                mediaElement = document.createElement('video');
                mediaElement.loop = true;
                mediaElement.muted = true;
                mediaElement.playsInline = true;
                mediaElement.addEventListener('click', () => {
                    if (mediaElement.paused) mediaElement.play();
                    else mediaElement.pause();
                });
            } else {
                mediaElement = document.createElement('img');
            }
            mediaElement.src = data.url;

            const overlay = document.createElement('div');
            overlay.className = 'absolute bottom-20 left-0 p-4 text-white overlay-content w-full interactive-ui';
            overlay.innerHTML = `<div class="flex items-center"><div class="w-10 h-10 bg-gray-400 rounded-full mr-3 bg-cover bg-center" style="background-image: url('${data.profilePic}')"></div><div><h3 class="font-bold text-lg">${data.user}</h3></div></div>`;

            const controls = document.createElement('div');
            controls.className = 'absolute bottom-20 right-0 p-4 flex flex-col items-center space-y-4 text-white overlay-content interactive-ui';
            
            mediaItem.appendChild(mediaElement);
            mediaItem.appendChild(overlay);
            
            if (data.type === 'video') {
                const volumeIconSVG = `<svg class="w-8 h-8" fill="currentColor" viewBox="0 0 20 20"><path d="M7 4a1 1 0 000 2v4a1 1 0 102 0V6a1 1 0 00-2 0zm4 0a1 1 0 000 2v4a1 1 0 102 0V6a1 1 0 00-2 0zm-2-3a1 1 0 00-1 1v10a1 1 0 102 0V2a1 1 0 00-1-1zM3 5a1 1 0 011-1h1a1 1 0 110 2H4a1 1 0 01-1-1zm13 0a1 1 0 011-1h1a1 1 0 110 2h-1a1 1 0 01-1-1z"></path></svg>`;
                const volumeControlContainer = document.createElement('div');
                volumeControlContainer.className = 'volume-control-container text-center';
                volumeControlContainer.innerHTML = `
                    ${volumeIconSVG}
                    <div class="volume-slider">
                        <input type="range" min="0" max="1" step="0.01" value="0.5" class="volume-bar">
                    </div>
                `;
                controls.appendChild(volumeControlContainer);
                
                const volumeBar = volumeControlContainer.querySelector('.volume-bar');
                volumeBar.addEventListener('input', (e) => {
                    mediaElement.volume = e.target.value;
                    mediaElement.muted = e.target.value === '0';
                });

                const progressBarContainer = document.createElement('div');
                progressBarContainer.className = 'progress-bar-container interactive-ui';
                const progressBar = document.createElement('input');
                progressBar.type = 'range';
                progressBar.className = 'progress-bar';
                progressBar.value = 0;
                progressBarContainer.appendChild(progressBar);
                mediaItem.appendChild(progressBarContainer);

                mediaElement.addEventListener('loadedmetadata', () => progressBar.max = mediaElement.duration);
                mediaElement.addEventListener('timeupdate', () => progressBar.value = mediaElement.currentTime);
                progressBar.addEventListener('input', () => mediaElement.currentTime = progressBar.value);
            }

            mediaItem.appendChild(controls);
            
            const resetUITimer = () => {
                clearTimeout(hideUITimer);
                mediaItem.querySelectorAll('.interactive-ui').forEach(el => el.classList.remove('fade-out'));
                hideUITimer = setTimeout(() => {
                    mediaItem.querySelectorAll('.interactive-ui').forEach(el => el.classList.add('fade-out'));
                }, 2000);
            };
            mediaItem.addEventListener('pointermove', resetUITimer);
            mediaItem.addEventListener('pointerdown', resetUITimer);
            
            mediaFeed.appendChild(mediaItem);
        });

        unmuteOverlay.addEventListener('click', () => {
            unmuteOverlay.style.display = 'none';
            document.querySelectorAll('video').forEach(video => {
                video.muted = false;
                const volumeBar = video.closest('.media-item').querySelector('.volume-bar');
                if(volumeBar) video.volume = volumeBar.value;
            });
        }, { once: true });
        
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const video = entry.target.querySelector('video');
                if (video) {
                    if (entry.isIntersecting) {
                        video.play().catch(e => console.log("Reproducción automática necesita interacción.", e));
                        entry.target.dispatchEvent(new Event('pointermove')); // Activar UI al scrollear
                    } else {
                        video.pause();
                    }
                }
            });
        }, { threshold: 0.8 });

        document.querySelectorAll('.media-item').forEach(item => observer.observe(item));
