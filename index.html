<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador Mensual Anime Personalizable</title>
    <!-- Librerías Externas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script type="module" src="https://cdn.skypack.dev/canvas-confetti"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Homemade+Apple&family=Indie+Flower&family=Kalam:wght@300;400;700&family=Shadows+Into+Light&family=DynaPuff:wght@400;700&display=swap');

        :root {
            --paper: #fdfbfd;
            --background: #f8f3f9;
            --ink: #5a4b66;
            --ink-editable: #5a4b66;
            --accent-1: #c399d1; 
            --accent-2: #ef9389; 
            --accent-3: #acd4f0; 
            --grid-line: rgba(195, 153, 209, 0.2);
            --logo-color-1: #c399d1;
            --logo-color-2: #ef9389;
            --logo-color-3: #acd4f0;
            --bg-opacity: 0.15;
            --bg-size: contain;
            --bg-pos-x: 50%;
            --bg-pos-y: 50%;
            --glow-intensity: 1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Indie Flower', cursive;
            background-color: var(--background);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--ink);
            padding: 20px;
            gap: 20px;
        }
       
        .settings-panel {
            width: 100%;
            max-width: 1200px;
            background-color: #fff;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1.5rem;
            border: 1px solid #eee;
            font-family: 'Kalam', cursive;
        }

        .settings-controls-wrapper {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1.5rem;
            flex: 1;
        }

        .control-group { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;}
        .control-group label { font-size: 1.1rem; font-weight: 600; color: var(--ink); }
        .control-group select, .control-group input[type="number"], .control-group input[type="url"], .control-group input[type="range"] { font-family: 'Kalam', cursive; font-size: 1rem; padding: 0.4rem 0.8rem; border: 1px solid #ddd; border-radius: 8px; background-color: #fff; color: var(--ink); cursor: pointer; }
        .control-group input[type="url"] { width: 250px; }
        .control-group input[type="range"] { padding: 0; }
        .control-group input[type="color"] { width: 40px; height: 40px; border: 1px solid #ddd; border-radius: 50%; cursor: pointer; padding: 2px; background-color: transparent; -webkit-appearance: none; -moz-appearance: none; appearance: none; }
        .control-group input[type="color"]::-webkit-color-swatch { border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 2px rgba(0,0,0,0.2); }
        .control-group input[type="color"]::-moz-color-swatch { border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 2px rgba(0,0,0,0.2); }
       
        .action-buttons { display: flex; gap: 1rem; flex-wrap: wrap; flex-shrink: 0; }
        .action-btn { background-color: var(--accent-1); color: #fff; font-weight: 700; font-family: 'Kalam', cursive; font-size: 1rem; border: none; padding: 0.7rem 1.2rem; border-radius: 8px; cursor: pointer; transition: background-color 0.3s, opacity 0.3s, transform 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .action-btn:hover:not(:disabled) { transform: translateY(-2px); }
        #addTaskBtn { background-color: transparent; border: 2px solid var(--accent-2); color: var(--accent-2); }
        #addTaskBtn:hover:not(:disabled) { background-color: var(--accent-2); color: #fff; }
        #toggleSidebarBtn, #saveJsonBtn, #loadJsonBtn, #addArrowBtn { background-color: transparent; border: 2px solid var(--accent-3); color: var(--accent-3); }
        #toggleSidebarBtn:hover:not(:disabled), #saveJsonBtn:hover:not(:disabled), #loadJsonBtn:hover:not(:disabled), #addArrowBtn:hover:not(:disabled) { background-color: var(--accent-3); color: #fff; }
        .action-btn:disabled { background-color: #999; cursor: not-allowed; opacity: 0.7; }

        .planner-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1200px;
            height: auto; 
            min-height: 85vh;
            position: relative;
            box-shadow: 0 10px 30px rgba(195, 153, 209, 0.2);
            background: var(--paper);
            border-radius: 5px;
            overflow: hidden;
            transition: box-shadow 0.3s ease-in-out;
        }
       
        @media (min-width: 1024px) {
            .planner-container {
                flex-direction: row;
            }
        }
       
        .page {
            flex: 1;
            padding: 20px;
            position: relative;
        }

        .page-content-wrapper {
            position: relative;
        }
       
        #background-image-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: var(--bg-size);
            background-position: var(--bg-pos-x) var(--bg-pos-y);
            background-repeat: no-repeat;
            opacity: var(--bg-opacity);
            pointer-events: none;
            z-index: 1;
        }
       
        @media (min-width: 1024px) {
             .page { border-right: 1px solid var(--grid-line); }
        }

        .page::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background-image: radial-gradient(rgba(195, 153, 209, 0.05) 1px, transparent 1px);
            background-size: 10px 10px;
            pointer-events: none;
            z-index: 1;
        }

        .month-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom:15px;
            position: relative;
            z-index: 2;
            gap: 20px;
            min-height: 100px;
        }

        .logo-placeholder {
            flex-shrink: 0;
        }
       
        .text-logo {
            font-family: 'DynaPuff', cursive;
            line-height: 0.9;
            position: relative;
            width: 300px;
            height: 100px;
        }

        .logo-part {
            position: absolute;
            font-weight: 700;
            transition: text-shadow 0.3s ease-in-out;
        }
       
        #logo-emilie {
            font-size: 2.5rem;
            color: var(--logo-color-1);
            top: 15px;
            left: 0;
        }
       
        #logo-ampersand {
            font-size: 1.8rem;
            color: var(--logo-color-2);
            top: 35px;
            left: 120px;
        }
       
        #logo-estephany {
            font-size: 2.5rem;
            color: var(--logo-color-3);
            top: 40px;
            left: 140px;
        }

        .month-name {
            font-family: 'Shadows Into Light', cursive;
            font-size: 2.8rem;
            font-weight: 600;
            color: var(--accent-1);
            text-shadow: 1px 1px 2px rgba(195, 153, 209, 0.2);
            letter-spacing: 2px;
            text-align: right;
            flex-grow: 1;
            transition: text-shadow 0.3s ease-in-out;
        }
       
        .calendar {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            position: relative;
            z-index: 2;
        }

        .calendar th {
            padding: 8px 0;
            font-weight: normal;
            color: var(--accent-1);
            border-bottom: 1px solid var(--grid-line);
            font-family: 'Kalam', cursive;
            font-size: 0.8rem;
            transition: text-shadow 0.3s ease-in-out;
        }
       
        .calendar td {
            height: 90px;
            border: 1px solid var(--grid-line);
            vertical-align: top;
            padding: 5px;
            position: relative;
            overflow: hidden;
        }
       
        .epic-frame {
            border: 2px solid gold !important;
            box-shadow: 0 0 10px 3px rgba(255, 215, 0, 0.7), inset 0 0 10px rgba(255, 215, 0, 0.5);
            z-index: 5;
            overflow: hidden;
        }

        .confetti-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .day-number {
            position: absolute;
            top: 4px;
            right: 6px;
            font-size: 0.9rem;
            color: var(--accent-1);
            opacity: 0.7;
            font-family: 'Kalam', cursive;
            transition: text-shadow 0.3s ease-in-out;
        }
       
        .stream-time {
            position: absolute;
            top: 6px;
            left: 6px;
            font-size: 0.6rem;
            font-family: 'Kalam', 'cursive';
            color: var(--accent-2);
            padding: 1px 4px;
            border-radius: 4px;
            font-weight: 700;
            transition: text-shadow 0.3s ease-in-out;
        }

        .note {
            font-family: 'Shadows Into Light', cursive;
            font-size: 14px;
            line-height: 1.3;
            min-height: 20px;
            height: 100%;
            padding-top: 22px;
            overflow-y: auto;
            color: var(--ink-editable);
            transition: text-shadow 0.3s ease-in-out;
        }
       
        [contenteditable]:hover { outline: 2px dashed var(--accent-3); }
        [contenteditable]:focus { background-color: rgba(172, 212, 240, 0.2); outline: none; }


        .sidebar {
            width: 100%;
            padding: 15px;
            border-top: 1px solid var(--grid-line);
            position: relative;
            z-index: 2;
        }

        @media (min-width: 1024px) {
            .sidebar {
                width: 220px;
                flex-shrink: 0;
                border-left: 1px solid var(--grid-line);
                border-top: none;
            }
        }
       
        .year {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--accent-2);
            font-family: 'Shadows Into Light', cursive;
            letter-spacing: 1px;
            transition: text-shadow 0.3s ease-in-out;
        }

        .tasks-header {
            font-size: 0.9rem;
            margin-bottom: 10px;
            text-align: center;
            color: var(--accent-1);
            font-family: 'Kalam', cursive;
            transition: text-shadow 0.3s ease-in-out;
        }

        .task-list {
            list-style-type: none;
            padding: 0;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-family: 'Shadows Into Light', cursive;
            font-size: 0.8rem;
            transform: rotate(1deg);
            color: var(--ink-editable);
            transition: text-shadow 0.3s ease-in-out;
        }
        
        .task-item span {
            transition: text-shadow 0.3s ease-in-out;
        }

        .task-item input[type="checkbox"] {
            width: 12px;
            height: 12px;
            border: 1.5px solid var(--accent-1);
            margin-right: 8px;
            flex-shrink: 0;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .task-item input[type="checkbox"]:checked {
            background-color: var(--accent-1);
        }
        .task-item span[contenteditable] {
            flex-grow: 1;
        }
        .task-item span:focus {
            background-color: rgba(172, 212, 240, 0.3);
        }

        .remove-task-btn {
            background: none;
            border: none;
            font-family: 'Kalam', cursive;
            font-size: 1.2rem;
            color: var(--accent-2);
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s, transform 0.2s;
            padding: 0 5px;
            line-height: 1;
        }
        .remove-task-btn:hover {
            opacity: 1;
            transform: scale(1.2);
        }

        #individual-note-editor {
            flex-wrap: nowrap;
        }

        #individual-font-size-input {
            width: 100px;
        }

        #individual-font-size-display {
            width: 40px;
            text-align: left;
        }

        /* Switch Styles */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            -webkit-transition: .4s;
            transition: .4s;
            border-radius: 28px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            -webkit-transition: .4s;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: var(--accent-1);
        }
        input:checked + .slider:before {
            -webkit-transform: translateX(22px);
            -ms-transform: translateX(22px);
            transform: translateX(22px);
        }

        /* Glow Effect Styles */
        body.glow-mode .planner-container {
            box-shadow: 0 0 calc(var(--glow-intensity) * 5px) var(--accent-1), 0 0 calc(var(--glow-intensity) * 10px) var(--accent-1), 0 0 calc(var(--glow-intensity) * 15px) var(--accent-3), inset 0 0 calc(var(--glow-intensity) * 4px) var(--accent-1);
        }

        body.glow-mode .logo-part,
        body.glow-mode .month-name,
        body.glow-mode .year,
        body.glow-mode .tasks-header,
        body.glow-mode .day-number,
        body.glow-mode .calendar th {
            text-shadow: 0 0 calc(var(--glow-intensity) * 4px) currentColor, 0 0 calc(var(--glow-intensity) * 8px) currentColor;
        }

        body.glow-mode .note,
        body.glow-mode .task-item span {
             text-shadow: 0 0 calc(var(--glow-intensity) * 3px) var(--ink-editable), 0 0 calc(var(--glow-intensity) * 5px) var(--ink-editable);
        }

        body.glow-mode .stream-time {
             text-shadow: 0 0 calc(var(--glow-intensity) * 3px) var(--accent-2), 0 0 calc(var(--glow-intensity) * 5px) var(--accent-2);
        }
        
        body.glow-mode .draggable-arrow {
            filter: drop-shadow(0 0 calc(var(--glow-intensity) * 4px) var(--ink-editable));
        }

        /* Arrow Styles */
        #arrow-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .draggable-arrow {
            position: absolute;
            width: 150px;
            height: 150px;
            cursor: move;
            pointer-events: all;
            color: var(--ink-editable);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: filter 0.3s ease-in-out;
        }
        
        .draggable-arrow.selected {
            outline: 2px dashed var(--accent-3);
        }

        .draggable-arrow svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        .draggable-arrow .arrow-path {
            stroke: none;
            fill: currentColor;
        }

        .resizer {
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--accent-3);
            border: 1px solid #fff;
            border-radius: 50%;
            display: none;
        }
        .draggable-arrow.selected .resizer {
            display: block;
        }

        .resizer.bottom-right {
            bottom: -5px;
            right: -5px;
            cursor: se-resize;
        }
        
        .arrow-controls {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 5px;
            background: #fff;
            padding: 5px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .draggable-arrow.selected .arrow-controls {
            display: flex;
        }

        .arrow-controls button {
            background: var(--accent-1);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 25px;
            height: 25px;
            font-family: sans-serif;
            font-weight: bold;
            font-size: 1.2rem;
            line-height: 1;
        }

        .arrow-controls button.delete-arrow-btn {
            background-color: var(--accent-2);
        }
    </style>
</head>
<body>
    <div class="settings-panel">
        <div class="settings-controls-wrapper">
            <div class="control-group">
                <label for="month-selector">Mes:</label>
                <select id="month-selector"></select>
                <label for="year-input">Año:</label>
                <input type="number" id="year-input" min="1900" max="2100">
            </div>
            <div class="control-group">
                <label>Colores del Logo:</label>
                <input type="color" id="logo-color-1" title="Color 'Emilie'">
                <input type="color" id="logo-color-2" title="Color '&'">
                <input type="color" id="logo-color-3" title="Color 'Estephany'">
            </div>
            <div class="control-group">
                <label>Otros Colores:</label>
                <input type="color" id="accent-color-1" title="Color Principal">
                <input type="color" id="accent-color-2" title="Líneas y Acentos">
                <input type="color" id="paper-color" title="Color de Fondo">
                <input type="color" id="ink-color" title="Color de Texto">
            </div>
            <div class="control-group">
                <label for="background-image-url">Imagen de Fondo:</label>
                <input type="url" id="background-image-url" placeholder="Pega la URL de una imagen aquí">
            </div>
            <div class="control-group">
                <label for="background-opacity-slider">Opacidad:</label>
                <input type="range" id="background-opacity-slider" min="0" max="1" step="0.05">
                <label for="background-size-slider">Zoom:</label>
                <input type="range" id="background-size-slider" min="20" max="200" value="100">
                <label for="background-pos-x">Posición X/Y:</label>
                <input type="range" id="background-pos-x" min="-50" max="150" value="50" title="Posición Horizontal">
                <input type="range" id="background-pos-y" min="-50" max="150" value="50" title="Posición Vertical">
            </div>
            <div id="individual-note-editor" class="control-group" style="display: none; border-left: 2px solid var(--accent-3); padding-left: 1rem;">
                <label id="editing-day-label" for="individual-font-size-input">Fuente (Día X):</label>
                <input type="range" id="individual-font-size-input" min="10" max="24" step="1" value="14">
                <span id="individual-font-size-display">14px</span>
            </div>
             <div class="control-group">
                <label for="glow-toggle">Efecto Glow:</label>
                <label class="switch">
                    <input type="checkbox" id="glow-toggle">
                    <span class="slider"></span>
                </label>
                <label for="glow-intensity-slider" style="margin-left: 1rem;">Intensidad:</label>
                <input type="range" id="glow-intensity-slider" min="0.5" max="2" step="0.1" value="1">
            </div>
        </div>
        <div class="action-buttons">
            <button id="addArrowBtn" class="action-btn">Añadir Flecha</button>
            <button id="addTaskBtn" class="action-btn">Añadir Tarea</button>
            <button id="downloadBtn" class="action-btn">Descargar PNG</button>
            <button id="toggleSidebarBtn" class="action-btn">Ocultar Panel</button>
            <button id="saveJsonBtn" class="action-btn">💾 Guardar</button>
            <button id="loadJsonBtn" class="action-btn">📂 Cargar</button>
            <input type="file" id="json-upload" accept="application/json" style="display: none;">
        </div>
    </div>

    <div id="export-area" class="planner-container">
        <div class="page" id="main-page">
             <div id="background-image-container"></div>
            <div class="page-content-wrapper">
                <div id="arrow-container"></div>
                <div class="month-header">
                    <div class="logo-placeholder">
                       <div class="text-logo">
                           <span id="logo-emilie" class="logo-part">Emilie</span>
                           <span id="logo-ampersand" class="logo-part">&</span>
                           <span id="logo-estephany" class="logo-part">Estephany</span>
                       </div>
                    </div>
                    <div id="month-name" class="month-name" contenteditable="true"></div>
                </div>
                <table class="calendar">
                    <thead><tr><th>L</th><th>M</th><th>X</th><th>J</th><th>V</th><th>S</th><th>D</th></tr></thead>
                    <tbody id="calendar-body"></tbody>
                </table>
            </div>
        </div>
        <aside class="sidebar">
            <div id="year-display" class="year" contenteditable="true"></div>
            <h3 class="tasks-header" contenteditable="true">Tareas / Tasks</h3>
            <ul class="task-list"></ul>
        </aside>
    </div>

<script type="module">
    import confetti from "https://cdn.skypack.dev/canvas-confetti";

    document.addEventListener('DOMContentLoaded', function() {
        const controls = {
            month: document.getElementById('month-selector'),
            year: document.getElementById('year-input'),
            logoColor1: document.getElementById('logo-color-1'),
            logoColor2: document.getElementById('logo-color-2'),
            logoColor3: document.getElementById('logo-color-3'),
            accentColor1: document.getElementById('accent-color-1'),
            accentColor2: document.getElementById('accent-color-2'),
            paperColor: document.getElementById('paper-color'),
            inkColor: document.getElementById('ink-color'),
            bgImageUrl: document.getElementById('background-image-url'),
            bgOpacitySlider: document.getElementById('background-opacity-slider'),
            bgSizeSlider: document.getElementById('background-size-slider'),
            bgPosXSlider: document.getElementById('background-pos-x'),
            bgPosYSlider: document.getElementById('background-pos-y'),
            addTaskBtn: document.getElementById('addTaskBtn'),
            downloadBtn: document.getElementById('downloadBtn'),
            toggleSidebarBtn: document.getElementById('toggleSidebarBtn'),
            saveJsonBtn: document.getElementById('saveJsonBtn'),
            loadJsonBtn: document.getElementById('loadJsonBtn'),
            jsonUpload: document.getElementById('json-upload'),
            glowToggle: document.getElementById('glow-toggle'),
            glowIntensitySlider: document.getElementById('glow-intensity-slider'),
            addArrowBtn: document.getElementById('addArrowBtn'),
            // Individual Note Editor Controls
            individualNoteEditor: document.getElementById('individual-note-editor'),
            editingDayLabel: document.getElementById('editing-day-label'),
            fontSizeInput: document.getElementById('individual-font-size-input'),
            fontSizeDisplay: document.getElementById('individual-font-size-display'),
        };

        const display = {
            planner: document.getElementById('export-area'),
            monthName: document.getElementById('month-name'),
            year: document.getElementById('year-display'),
            calendarBody: document.getElementById('calendar-body'),
            todoList: document.querySelector('.task-list'),
            bgImageContainer: document.getElementById('background-image-container'),
            sidebar: document.querySelector('.sidebar'),
            arrowContainer: document.getElementById('arrow-container'),
        };
        
        const monthData = {
            names: ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"]
        };
        let taskCounter = 0;
        let confettiInterval = null;
        let activeNoteElement = null;
        let activeArrowElement = null;
       
        function initialize() {
            monthData.names.forEach((name, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = name;
                controls.month.appendChild(option);
            });
           
            controls.downloadBtn.disabled = true;
            controls.downloadBtn.textContent = "Cargando...";

            document.fonts.ready.then(() => {
                controls.downloadBtn.disabled = false;
                controls.downloadBtn.textContent = "Descargar PNG";
               
                const today = new Date();
                controls.month.value = today.getMonth();
                controls.year.value = today.getFullYear();

                const rootStyle = getComputedStyle(document.documentElement);
                controls.logoColor1.value = rootStyle.getPropertyValue('--logo-color-1').trim();
                controls.logoColor2.value = rootStyle.getPropertyValue('--logo-color-2').trim();
                controls.logoColor3.value = rootStyle.getPropertyValue('--logo-color-3').trim();
                controls.accentColor1.value = rootStyle.getPropertyValue('--accent-1').trim();
                controls.accentColor2.value = rootStyle.getPropertyValue('--accent-2').trim();
                controls.paperColor.value = rootStyle.getPropertyValue('--paper').trim();
                controls.inkColor.value = rootStyle.getPropertyValue('--ink-editable').trim();
                controls.bgOpacitySlider.value = rootStyle.getPropertyValue('--bg-opacity').trim();
                controls.bgSizeSlider.value = 100;
                controls.bgPosXSlider.value = 50;
                controls.bgPosYSlider.value = 50;
               
                updateFullDisplay();

                for(let i=0; i<5; i++) {
                    addTask(i === 0 ? "¡Planificar el mes!" : "...");
                }
            });
           
            // --- Event Listeners ---
            controls.month.addEventListener('change', updateFullDisplay);
            controls.year.addEventListener('input', updateFullDisplay);
           
            controls.logoColor1.addEventListener('input', () => updateCssVariable('--logo-color-1', controls.logoColor1.value));
            controls.logoColor2.addEventListener('input', () => updateCssVariable('--logo-color-2', controls.logoColor2.value));
            controls.logoColor3.addEventListener('input', () => updateCssVariable('--logo-color-3', controls.logoColor3.value));
            controls.accentColor1.addEventListener('input', () => updateCssVariable('--accent-1', controls.accentColor1.value));
           
            controls.accentColor2.addEventListener('input', () => {
                const colorValue = controls.accentColor2.value;
                updateCssVariable('--accent-2', colorValue);
                const rgb = hexToRgb(colorValue);
                if (rgb) {
                    updateCssVariable('--grid-line', `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.3)`);
                }
            });
           
            controls.paperColor.addEventListener('input', () => updateCssVariable('--paper', controls.paperColor.value));
            controls.inkColor.addEventListener('input', () => updateCssVariable('--ink-editable', controls.inkColor.value));
            controls.bgImageUrl.addEventListener('input', (e) => (display.bgImageContainer.style.backgroundImage = `url(${e.target.value})`));
            controls.bgOpacitySlider.addEventListener('input', (e) => updateCssVariable('--bg-opacity', e.target.value));
            controls.bgSizeSlider.addEventListener('input', (e) => updateCssVariable('--bg-size', `${e.target.value}%`));
            controls.bgPosXSlider.addEventListener('input', (e) => updateCssVariable('--bg-pos-x', `${e.target.value}%`));
            controls.bgPosYSlider.addEventListener('input', (e) => updateCssVariable('--bg-pos-y', `${e.target.value}%`));

            controls.addTaskBtn.addEventListener('click', () => addTask('Nueva tarea'));
            controls.downloadBtn.addEventListener('click', handleDownload);
            controls.toggleSidebarBtn.addEventListener('click', toggleSidebar);
            controls.saveJsonBtn.addEventListener('click', saveConfiguration);
            controls.loadJsonBtn.addEventListener('click', () => controls.jsonUpload.click());
            controls.jsonUpload.addEventListener('change', loadConfiguration);
            controls.addArrowBtn.addEventListener('click', () => createArrow());
           
            controls.glowToggle.addEventListener('change', (e) => {
                document.body.classList.toggle('glow-mode', e.target.checked);
            });
            
            controls.glowIntensitySlider.addEventListener('input', (e) => {
                updateCssVariable('--glow-intensity', e.target.value);
            });

            display.todoList.addEventListener('click', function(e) {
                if (e.target.matches('.remove-task-btn')) {
                    e.target.closest('.task-item')?.remove();
                }
            });
            
            // --- Note Editor Listeners ---
            display.calendarBody.addEventListener('focusin', (e) => {
                if (e.target.classList.contains('note')) {
                    handleNoteFocus(e.target);
                }
            });
            
            controls.fontSizeInput.addEventListener('input', (e) => {
                if (activeNoteElement) {
                    const newSize = e.target.value;
                    activeNoteElement.style.fontSize = `${newSize}px`;
                    controls.fontSizeDisplay.textContent = `${newSize}px`;
                }
            });
            
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.draggable-arrow')) {
                    deselectAllArrows();
                }
            });
        }
        
        function handleNoteFocus(noteElement) {
            activeNoteElement = noteElement;
            const dayNumber = activeNoteElement.closest('td').querySelector('.day-number').textContent;
            const currentSize = parseInt(window.getComputedStyle(noteElement).fontSize) || 14;
            
            controls.editingDayLabel.textContent = `Fuente (Día ${dayNumber}):`;
            controls.fontSizeInput.value = currentSize;
            controls.fontSizeDisplay.textContent = `${currentSize}px`;
            controls.individualNoteEditor.style.display = 'flex';
        }

        function updateFullDisplay() {
            if (confettiInterval) {
                clearInterval(confettiInterval);
                confettiInterval = null;
            }
            const year = parseInt(controls.year.value);
            const month = parseInt(controls.month.value);
            if (isNaN(year) || isNaN(month)) return;

            display.monthName.textContent = monthData.names[month].toUpperCase();
            display.year.textContent = year;
            generateCalendar(year, month);
        }

        function generateCalendar(year, month) {
            display.calendarBody.innerHTML = '';
            const firstDay = new Date(year, month, 1);
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            let startingDay = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1; 
           
            let date = 1;
            let row = document.createElement('tr');
            display.calendarBody.appendChild(row);

            for (let i = 0; i < startingDay; i++) {
                const cell = document.createElement('td');
                cell.classList.add('empty-day');
                row.appendChild(cell);
            }

            while (date <= daysInMonth) {
                if (row.children.length === 7) {
                    row = document.createElement('tr');
                    display.calendarBody.appendChild(row);
                }

                const cell = document.createElement('td');
                let noteContent = '';
                let cellHTML = `<div class="day-number">${date}</div>`;
               
                const currentDayOfWeek = new Date(year, month, date).getDay();
                if ([1, 3, 5, 6].includes(currentDayOfWeek)) { // L, X, V, S
                    cellHTML += `<div class="stream-time">Stream 5:30pm MX</div>`;
                }
               
                if (month === 9 && date === 25) { // Cumpleaños en Octubre 25
                    cell.classList.add('epic-frame');
                    cellHTML += '<canvas class="confetti-canvas"></canvas>';
                }

                cellHTML += `<div class="note" contenteditable="true">${noteContent}</div>`;
                cell.innerHTML = cellHTML;

                row.appendChild(cell);
                date++;
            }
           
            while (row.children.length > 0 && row.children.length < 7) {
                 const cell = document.createElement('td');
                 cell.classList.add('empty-day');
                 row.appendChild(cell);
            }
           
            if (month === 9) { // Octubre
                const birthdayCell = display.calendarBody.querySelector('.epic-frame');
                if (birthdayCell) {
                   startBirthdayConfetti(birthdayCell);
                }
            }
        }
       
        function startBirthdayConfetti(targetCell) {
            if (confettiInterval || !targetCell) return;
            const canvas = targetCell.querySelector('.confetti-canvas');
            if(!canvas) return;

            const myConfetti = confetti.create(canvas, {
                resize: true,
                useWorker: true
            });

            const defaults = { 
                spread: 360, 
                ticks: 100,
                gravity: 0.1, 
                decay: 0.98,
                startVelocity: 10,
                zIndex: 10 
            };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            confettiInterval = setInterval(function() {
                const particleCount = 10;
                const colors = [controls.logoColor1.value, controls.logoColor2.value, controls.logoColor3.value, '#ffd700'];
               
                myConfetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.9), y: Math.random() - 0.2 }, colors: colors }));
            }, 800);
        }


        function updateCssVariable(variable, value) {
            document.documentElement.style.setProperty(variable, value);
        }
       
        function hexToRgb(hex) {
            let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        function addTask(text, isChecked = false) {
            taskCounter++;
            const newLi = document.createElement('li');
            newLi.classList.add('task-item');
            newLi.innerHTML = `<input type="checkbox" id="task${taskCounter}"> <span contenteditable="true">${text}</span><button class="remove-task-btn" title="Quitar tarea">×</button>`;
            newLi.querySelector('input[type="checkbox"]').checked = isChecked;
            display.todoList.appendChild(newLi);
        }
       
        function handleDownload() {
            deselectAllArrows();
            const downloadButton = controls.downloadBtn;
            downloadButton.textContent = "Generando...";
            downloadButton.disabled = true;

            setTimeout(() => {
                if (confettiInterval) clearInterval(confettiInterval);
                
                html2canvas(document.getElementById('export-area'), {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--paper').trim(),
                    onclone: (clonedDoc) => {
                        const activeElement = clonedDoc.activeElement;
                        if(activeElement && activeElement.blur) {
                           activeElement.blur();
                        }
                    }
                })
                .then(canvas => {
                    const link = document.createElement('a');
                    link.download = `planificador-${controls.year.value}-${monthData.names[controls.month.value]}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    downloadButton.textContent = "Descargar PNG";
                    downloadButton.disabled = false;
                    updateFullDisplay();
                }).catch(err => {
                    console.error("Error al generar el canvas: ", err);
                    downloadButton.textContent = "Error";
                    setTimeout(() => { 
                        downloadButton.textContent = "Descargar PNG"; 
                        downloadButton.disabled = false; 
                    }, 2000);
                     updateFullDisplay();
                });
            }, 500);
        }
        
        function toggleSidebar() {
            const isHidden = display.sidebar.style.display === 'none';
            display.sidebar.style.display = isHidden ? '' : 'none';
            controls.toggleSidebarBtn.textContent = isHidden ? 'Ocultar Panel' : 'Mostrar Panel';
        }
        
        function updateArrowTransform(element) {
            const rot = element.dataset.rotation || '0';
            const sx = element.dataset.scaleX || '1';
            const sy = element.dataset.scaleY || '1';
            element.style.transform = `rotate(${rot}deg) scale(${sx}, ${sy})`;
        }

        function makeDraggable(element) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            element.onmousedown = dragMouseDown;

            function dragMouseDown(e) {
                if (e.target.classList.contains('resizer') || e.target.closest('.arrow-controls')) return;
                e.preventDefault();
                selectArrow(element);
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function elementDrag(e) {
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                element.style.top = (element.offsetTop - pos2) + "px";
                element.style.left = (element.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }

        function makeResizable(element, resizer) {
            let original_width = 0, original_height = 0, original_x = 0, original_y = 0;
            resizer.onmousedown = function(e) {
                e.preventDefault();
                e.stopPropagation();
                original_width = parseFloat(getComputedStyle(element, null).getPropertyValue('width').replace('px', ''));
                original_height = parseFloat(getComputedStyle(element, null).getPropertyValue('height').replace('px', ''));
                original_x = e.clientX;
                original_y = e.clientY;
                window.onmousemove = resize;
                window.onmouseup = stopResize;
            }
            
            function resize(e) {
                const width = original_width + (e.clientX - original_x);
                const height = original_height + (e.clientY - original_y);
                if (width > 30) element.style.width = width + 'px';
                if (height > 30) element.style.height = height + 'px';
            }
            
            function stopResize() {
                window.onmousemove = null;
                window.onmouseup = null;
            }
        }
        
        function setupArrowControls(element, controlsDiv) {
            const rotateLeftBtn = controlsDiv.children[0];
            const rotateRightBtn = controlsDiv.children[1];
            const flipHBtn = controlsDiv.children[2];
            const flipVBtn = controlsDiv.children[3];
            const deleteBtn = controlsDiv.children[4];
            
            rotateLeftBtn.onclick = (e) => {
                e.stopPropagation();
                let rot = parseFloat(element.dataset.rotation) || 0;
                element.dataset.rotation = rot - 15;
                updateArrowTransform(element);
            };

            rotateRightBtn.onclick = (e) => {
                e.stopPropagation();
                let rot = parseFloat(element.dataset.rotation) || 0;
                element.dataset.rotation = rot + 15;
                updateArrowTransform(element);
            };

            flipHBtn.onclick = (e) => {
                e.stopPropagation();
                let sx = parseFloat(element.dataset.scaleX) || 1;
                element.dataset.scaleX = sx * -1;
                updateArrowTransform(element);
            };
            
            flipVBtn.onclick = (e) => {
                e.stopPropagation();
                let sy = parseFloat(element.dataset.scaleY) || 1;
                element.dataset.scaleY = sy * -1;
                updateArrowTransform(element);
            };

            deleteBtn.onclick = (e) => {
                e.stopPropagation();
                element.remove();
            };
        }

        function selectArrow(element) {
            deselectAllArrows();
            activeArrowElement = element;
            element.classList.add('selected');
        }

        function deselectAllArrows() {
            document.querySelectorAll('.draggable-arrow.selected').forEach(el => el.classList.remove('selected'));
            activeArrowElement = null;
        }

        function saveConfiguration() {
            const notes = {};
            document.querySelectorAll('.calendar td:not(.empty-day)').forEach(cell => {
                const day = cell.querySelector('.day-number').textContent;
                const noteEl = cell.querySelector('.note');
                const noteHTML = noteEl.innerHTML;
                const noteFontSize = noteEl.style.fontSize; 

                if ((noteHTML && noteHTML.trim() !== '') || noteFontSize) {
                    notes[day] = {
                        html: noteHTML,
                        fontSize: noteFontSize || ''
                    };
                }
            });

            const tasks = [];
            document.querySelectorAll('.task-item').forEach(item => {
                tasks.push({
                    text: item.querySelector('span').innerHTML,
                    checked: item.querySelector('input[type="checkbox"]').checked
                });
            });
            
            const arrows = [];
            document.querySelectorAll('.draggable-arrow').forEach(arrow => {
                arrows.push({
                    left: arrow.style.left,
                    top: arrow.style.top,
                    width: arrow.style.width,
                    height: arrow.style.height,
                    rotation: arrow.dataset.rotation,
                    scaleX: arrow.dataset.scaleX,
                    scaleY: arrow.dataset.scaleY
                });
            });

            const config = {
                version: 4,
                month: controls.month.value,
                year: controls.year.value,
                monthName: display.monthName.textContent,
                yearDisplay: display.year.textContent,
                tasksHeader: document.querySelector('.tasks-header').textContent,
                glowMode: controls.glowToggle.checked,
                glowIntensity: controls.glowIntensitySlider.value,
                styles: {
                    logoColor1: controls.logoColor1.value,
                    logoColor2: controls.logoColor2.value,
                    logoColor3: controls.logoColor3.value,
                    accentColor1: controls.accentColor1.value,
                    accentColor2: controls.accentColor2.value,
                    paperColor: controls.paperColor.value,
                    inkColor: controls.inkColor.value,
                },
                background: {
                    url: controls.bgImageUrl.value,
                    opacity: controls.bgOpacitySlider.value,
                    size: controls.bgSizeSlider.value,
                    posX: controls.bgPosXSlider.value,
                    posY: controls.bgPosYSlider.value
                },
                content: {
                    notes: notes,
                    tasks: tasks,
                    arrows: arrows
                }
            };

            const jsonString = JSON.stringify(config, null, 2);
            const blob = new Blob([jsonString], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `planner-config-${config.year}-${monthData.names[config.month]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function loadConfiguration(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const config = JSON.parse(e.target.result);
                    applyConfiguration(config);
                } catch (error) {
                    console.error("Error al cargar o parsear el archivo de configuración:", error);
                    alert("El archivo de configuración no es válido.");
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }
        
        function applyConfiguration(config) {
            // Cargar valores en los controles
            controls.month.value = config.month;
            controls.year.value = config.year;
            controls.logoColor1.value = config.styles.logoColor1;
            controls.logoColor2.value = config.styles.logoColor2;
            controls.logoColor3.value = config.styles.logoColor3;
            controls.accentColor1.value = config.styles.accentColor1;
            controls.accentColor2.value = config.styles.accentColor2;
            controls.paperColor.value = config.styles.paperColor;
            controls.inkColor.value = config.styles.inkColor;

            controls.bgImageUrl.value = config.background.url;
            controls.bgOpacitySlider.value = config.background.opacity;
            controls.bgSizeSlider.value = config.background.size;
            controls.bgPosXSlider.value = config.background.posX;
            controls.bgPosYSlider.value = config.background.posY;

            controls.glowToggle.checked = config.glowMode || false;
            document.body.classList.toggle('glow-mode', controls.glowToggle.checked);
            
            controls.glowIntensitySlider.value = config.glowIntensity || 1;
            updateCssVariable('--glow-intensity', controls.glowIntensitySlider.value);

            // Aplicar estilos directamente
            updateCssVariable('--logo-color-1', config.styles.logoColor1);
            updateCssVariable('--logo-color-2', config.styles.logoColor2);
            updateCssVariable('--logo-color-3', config.styles.logoColor3);
            updateCssVariable('--accent-1', config.styles.accentColor1);
            updateCssVariable('--accent-2', config.styles.accentColor2);
            updateCssVariable('--paper', config.styles.paperColor);
            updateCssVariable('--ink-editable', config.styles.inkColor);

            const rgb = hexToRgb(config.styles.accentColor2);
            if (rgb) {
                updateCssVariable('--grid-line', `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.3)`);
            }

            display.bgImageContainer.style.backgroundImage = `url(${config.background.url})`;
            updateCssVariable('--bg-opacity', config.background.opacity);
            updateCssVariable('--bg-size', `${config.background.size}%`);
            updateCssVariable('--bg-pos-x', `${config.background.posX}%`);
            updateCssVariable('--bg-pos-y', `${config.background.posY}%`);

            updateFullDisplay();

            setTimeout(() => {
                // Limpiar contenido anterior
                display.todoList.innerHTML = '';
                taskCounter = 0;
                display.arrowContainer.innerHTML = '';

                if (config.content && config.content.notes) {
                    Object.keys(config.content.notes).forEach(day => {
                        const cell = Array.from(document.querySelectorAll('.calendar td .day-number'))
                                          .find(el => el.textContent === day)?.closest('td');
                        if (cell) {
                            const noteEl = cell.querySelector('.note');
                            if(noteEl) {
                                const noteData = config.content.notes[day];
                                if (typeof noteData === 'object' && noteData !== null) {
                                    noteEl.innerHTML = noteData.html || '';
                                    if (noteData.fontSize) {
                                        noteEl.style.fontSize = noteData.fontSize;
                                    }
                                } else {
                                    noteEl.innerHTML = noteData;
                                }
                            }
                        }
                    });
                }
                
                if (config.content && config.content.tasks) {
                    config.content.tasks.forEach(task => addTask(task.text, task.checked));
                }
                
                if (config.content && config.content.arrows) {
                    config.content.arrows.forEach(arrowConfig => createArrow(arrowConfig));
                }

                if (config.monthName) display.monthName.textContent = config.monthName;
                if (config.yearDisplay) display.year.textContent = config.yearDisplay;
                if (config.tasksHeader) document.querySelector('.tasks-header').textContent = config.tasksHeader;
                deselectAllArrows();
            }, 100);
        }

        // --- Start the application ---
        initialize();
    });
</script>
</body>
</html>
