<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador Mensual Anime Personalizable</title>
    <!-- Librerías Externas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <!-- ** NUEVO: SDK de Supabase ** -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- BEGIN SHAREAHOLIC CODE -->
    <link rel="preload" href="https://cdn.shareaholic.net/assets/pub/shareaholic.js" as="script" />
    <meta name="shareaholic:site_id" content="6a2aa9a5d76d91785ac4d0518d8676bf" />
    <script data-cfasync="false" async src="https://cdn.shareaholic.net/assets/pub/shareaholic.js"></script>
    <!-- END SHAREAHOLIC CODE -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Homemade+Apple&family=Indie+Flower&family=Kalam:wght@300;400;700&family=Shadows+Into+Light&family=DynaPuff:wght@400;700&display=swap');

        :root {
            --paper: #ffffff;
            --background: #f4f1f7;
            --ink: #5a4b66;
            --ink-editable: #5a4b66;
            --accent-1: #c399d1;
            --accent-2: #ef9389;
            --accent-3: #7bc5f9;
            --grid-line: rgba(239, 147, 137, 0.2);
            --logo-color-1: #ff8ae0;
            --logo-color-2: #ef9389;
            --logo-color-3: #7bc5f9;
            --bg-opacity: 0.15;
            --bg-size: contain;
            --bg-pos-x: 50%;
            --bg-pos-y: 50%;
            --glow-intensity: 1;
            --main-page-height: 85vh;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Indie Flower', cursive;
            background-color: var(--background);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--ink);
            padding: 20px;
            gap: 20px;
        }
        
        .settings-panel {
            width: 100%;
            max-width: 1200px;
            background-color: #fff;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1.5rem;
            border: 1px solid #eee;
            font-family: 'Kalam', cursive;
            --ink: #5a4b66;
            --accent-1: #c399d1;
            --accent-2: #ef9389;
            --accent-3: #acd4f0;
        }

        .settings-controls-wrapper {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1.5rem;
            flex: 1;
        }

        .control-group { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;}
        .control-group label { font-size: 1.1rem; font-weight: 600; color: var(--ink); }
        .control-group select, .control-group input[type="number"], .control-group input[type="url"], .control-group input[type="range"] { font-family: 'Kalam', cursive; font-size: 1rem; padding: 0.4rem 0.8rem; border: 1px solid #ddd; border-radius: 8px; background-color: #fff; color: var(--ink); cursor: pointer; }
        .control-group input[type="url"] { width: 250px; }
        .control-group input[type="range"] { padding: 0; }
        .control-group input[type="color"] { width: 40px; height: 40px; border: 1px solid #ddd; border-radius: 50%; cursor: pointer; padding: 2px; background-color: transparent; -webkit-appearance: none; -moz-appearance: none; appearance: none; }
        .control-group input[type="color"]::-webkit-color-swatch { border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 2px rgba(0,0,0,0.2); }
        .control-group input[type="color"]::-moz-color-swatch { border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 2px rgba(0,0,0,0.2); }
        
        .action-buttons { display: flex; gap: 1rem; flex-wrap: wrap; flex-shrink: 0; align-items: center;}
        .action-btn { background-color: var(--accent-1); color: #fff; font-weight: 700; font-family: 'Kalam', cursive; font-size: 1rem; border: none; padding: 0.7rem 1.2rem; border-radius: 8px; cursor: pointer; transition: background-color 0.3s, color 0.3s, opacity 0.3s, transform 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .action-btn:hover:not(:disabled) { transform: translateY(-2px); }
        #downloadBtn { background-color: transparent; border: 2px solid var(--accent-1); color: var(--accent-1); }
        #downloadBtn:hover:not(:disabled) { background-color: var(--accent-1); color: #fff; }
        #addTaskBtn { background-color: transparent; border: 2px solid var(--accent-2); color: var(--accent-2); }
        #addTaskBtn:hover:not(:disabled) { background-color: var(--accent-2); color: #fff; }
        #toggleSidebarBtn, #addArrowBtn, #addItemBtn, #authBtn, #logoutBtn { background-color: transparent; border: 2px solid var(--accent-3); color: var(--accent-3); }
        #toggleSidebarBtn:hover:not(:disabled), #addArrowBtn:hover:not(:disabled), #addItemBtn:hover:not(:disabled), #authBtn:hover:not(:disabled), #logoutBtn:hover:not(:disabled) { background-color: var(--accent-3); color: #fff; }
        .action-btn:disabled { background-color: #999; cursor: not-allowed; opacity: 0.7; }

        .planner-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1200px;
            height: auto; 
            position: relative;
            box-shadow: 0 10px 30px rgba(195, 153, 209, 0.2);
            background: var(--paper);
            border-radius: 5px;
            overflow: hidden;
            transition: box-shadow 0.3s ease-in-out;
        }
        
        #calendar-wrapper {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        #main-page.with-next-month {
            border-bottom: 1px solid var(--grid-line);
        }

        @media (min-width: 1024px) {
            .planner-container {
                flex-direction: row;
            }
            #calendar-wrapper {
                border-right: 1px solid var(--grid-line);
            }
        }
        
        .page {
            padding: 20px;
            position: relative;
            min-height: var(--main-page-height);
        }

        #next-month-page {
            min-height: auto; /* Next month doesn't need a huge min-height */
        }

        .page-content-wrapper {
            position: relative;
        }
        
        #background-image-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: var(--bg-size);
            background-position: var(--bg-pos-x) var(--bg-pos-y);
            background-repeat: no-repeat;
            opacity: var(--bg-opacity);
            pointer-events: none;
            z-index: 1;
        }

        .page::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background-image: radial-gradient(rgba(195, 153, 209, 0.05) 1px, transparent 1px);
            background-size: 10px 10px;
            pointer-events: none;
            z-index: 1;
        }

        .month-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom:15px;
            position: relative;
            z-index: 2;
            gap: 20px;
            min-height: 100px;
        }

        .logo-placeholder {
            flex-shrink: 0;
        }
        
        .text-logo {
            font-family: 'DynaPuff', cursive;
            line-height: 0.9;
            position: relative;
            width: 300px;
            height: 100px;
        }

        .logo-part {
            position: absolute;
            font-weight: 700;
            transition: text-shadow 0.3s ease-in-out;
        }
        
        #logo-emilie {
            font-size: 2.5rem;
            color: var(--logo-color-1);
            top: 15px;
            left: 0;
        }
        
        #logo-ampersand {
            font-size: 1.8rem;
            color: var(--logo-color-2);
            top: 35px;
            left: 120px;
        }
        
        #logo-estephany {
            font-size: 2.5rem;
            color: var(--logo-color-3);
            top: 40px;
            left: 140px;
        }

        .month-year-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            flex-grow: 1;
        }

        .month-name {
            font-family: 'Shadows Into Light', cursive;
            font-size: 2.8rem;
            font-weight: 600;
            color: var(--accent-1);
            text-shadow: 1px 1px 2px rgba(195, 153, 209, 0.2);
            letter-spacing: 2px;
            text-align: right;
            transition: text-shadow 0.3s ease-in-out;
        }
        
        .calendar {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            position: relative;
            z-index: 2;
        }

        .calendar th {
            padding: 8px 0;
            font-weight: normal;
            color: var(--accent-1);
            border-bottom: 1px solid var(--grid-line);
            font-family: 'Kalam', cursive;
            font-size: 0.8rem;
            transition: text-shadow 0.3s ease-in-out;
        }
        
        .calendar td {
            height: 90px;
            border: 1px solid var(--grid-line);
            vertical-align: top;
            padding: 5px;
            position: relative;
            overflow: hidden;
        }
        
        .epic-frame {
            border: 2px solid gold !important;
            box-shadow: 0 0 10px 3px rgba(255, 215, 0, 0.7), inset 0 0 10px rgba(255, 215, 0, 0.5);
            z-index: 5;
            overflow: hidden;
        }

        .confetti-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .day-number {
            position: absolute;
            top: 4px;
            right: 6px;
            font-size: 0.9rem;
            color: var(--accent-1);
            opacity: 0.7;
            font-family: 'Kalam', cursive;
            transition: text-shadow 0.3s ease-in-out;
        }
        
        .stream-time {
            position: absolute;
            top: 6px;
            left: 6px;
            font-size: 0.6rem;
            font-family: 'Kalam', 'cursive';
            color: var(--accent-2);
            padding: 1px 4px;
            border-radius: 4px;
            font-weight: 700;
            transition: text-shadow 0.3s ease-in-out;
        }

        .note {
            font-family: 'Shadows Into Light', cursive;
            font-size: 14px;
            line-height: 1.3;
            min-height: 20px;
            height: 100%;
            padding-top: 22px;
            overflow-y: auto;
            color: var(--ink-editable);
            transition: text-shadow 0.3s ease-in-out;
        }
        
        [contenteditable]:hover { outline: 2px dashed var(--accent-3); }
        [contenteditable]:focus { background-color: rgba(172, 212, 240, 0.2); outline: none; }


        .sidebar {
            width: 100%;
            padding: 15px;
            border-top: 1px solid var(--grid-line);
            position: relative;
            z-index: 2;
        }

        @media (min-width: 1024px) {
            .sidebar {
                width: 220px;
                flex-shrink: 0;
                border-left: 1px solid var(--grid-line);
                border-top: none;
            }
        }
        
        .year {
            text-align: right;
            font-size: 1.8rem;
            font-weight: 700;
            margin: -10px 0 0 0;
            color: var(--accent-2);
            font-family: 'Shadows Into Light', cursive;
            letter-spacing: 1px;
            transition: text-shadow 0.3s ease-in-out;
            padding-right: 2px;
        }

        .tasks-header {
            font-size: 0.9rem;
            margin-bottom: 10px;
            text-align: center;
            color: var(--accent-1);
            font-family: 'Kalam', cursive;
            transition: text-shadow 0.3s ease-in-out;
        }

        .task-list {
            list-style-type: none;
            padding: 0;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-family: 'Shadows Into Light', cursive;
            font-size: 0.8rem;
            transform: rotate(1deg);
            color: var(--ink-editable);
            transition: text-shadow 0.3s ease-in-out;
        }
        
        .task-item span {
            transition: text-shadow 0.3s ease-in-out;
        }

        .task-item input[type="checkbox"] {
            width: 12px;
            height: 12px;
            border: 1.5px solid var(--accent-1);
            margin-right: 8px;
            flex-shrink: 0;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .task-item input[type="checkbox"]:checked {
            background-color: var(--accent-1);
        }
        .task-item span[contenteditable] {
            flex-grow: 1;
        }
        .task-item span:focus {
            background-color: rgba(172, 212, 240, 0.3);
        }

        .remove-task-btn {
            background: none;
            border: none;
            font-family: 'Kalam', cursive;
            font-size: 1.2rem;
            color: var(--accent-2);
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s, transform 0.2s;
            padding: 0 5px;
            line-height: 1;
        }
        .remove-task-btn:hover {
            opacity: 1;
            transform: scale(1.2);
        }

        #individual-note-editor {
            flex-wrap: nowrap;
        }

        #individual-font-size-input {
            width: 100px;
        }

        #individual-font-size-display {
            width: 40px;
            text-align: left;
        }

        /* Switch Styles */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            -webkit-transition: .4s;
            transition: .4s;
            border-radius: 28px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            -webkit-transition: .4s;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: var(--accent-1);
        }
        input:checked + .slider:before {
            -webkit-transform: translateX(22px);
            -ms-transform: translateX(22px);
            transform: translateX(22px);
        }

        /* Glow Effect Styles */
        body.glow-mode .planner-container {
            box-shadow: 0 0 calc(var(--glow-intensity) * 5px) var(--accent-1), 0 0 calc(var(--glow-intensity) * 10px) var(--accent-1), 0 0 calc(var(--glow-intensity) * 15px) var(--accent-3), inset 0 0 calc(var(--glow-intensity) * 4px) var(--accent-1);
        }

        body.glow-mode .logo-part,
        body.glow-mode .month-name,
        body.glow-mode .year,
        body.glow-mode .tasks-header,
        body.glow-mode .day-number,
        body.glow-mode .calendar th {
            text-shadow: 0 0 calc(var(--glow-intensity) * 4px) currentColor, 0 0 calc(var(--glow-intensity) * 8px) currentColor;
        }

        body.glow-mode .note,
        body.glow-mode .task-item span {
             text-shadow: 0 0 calc(var(--glow-intensity) * 3px) var(--ink-editable), 0 0 calc(var(--glow-intensity) * 5px) var(--ink-editable);
        }

        body.glow-mode .stream-time {
             text-shadow: 0 0 calc(var(--glow-intensity) * 3px) var(--accent-2), 0 0 calc(var(--glow-intensity) * 5px) var(--accent-2);
        }
        
        body.glow-mode .draggable-arrow,
        body.glow-mode .draggable-item {
            filter: drop-shadow(0 0 calc(var(--glow-intensity) * 4px) var(--ink-editable));
        }

        /* Elements Styles */
        #elements-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .draggable-arrow, .draggable-item {
            position: absolute;
            cursor: move;
            pointer-events: all;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: filter 0.3s ease-in-out;
        }
        .draggable-arrow {
            width: 150px;
            height: 150px;
            color: var(--ink-editable); /* Arrow is always recolored */
        }
        .draggable-item {
            width: 100px;
            height: 100px;
        }
        
        .draggable-arrow.selected, .draggable-item.selected {
            outline: 2px dashed var(--accent-3);
        }

        .draggable-arrow svg, .draggable-item svg, .draggable-item img {
            width: 100%;
            height: 100%;
            display: block;
        }
        .draggable-item img {
            object-fit: contain;
        }
        
        .draggable-arrow .arrow-path {
            stroke: none;
            fill: currentColor;
        }

        .draggable-item.color-override svg [fill]:not([fill="none"]) {
            fill: currentColor !important;
        }
        .draggable-item.color-override svg [stroke]:not([stroke="none"]) {
            stroke: currentColor !important;
        }


        .resizer {
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--accent-3);
            border: 1px solid #fff;
            border-radius: 50%;
            display: none;
        }
        .draggable-arrow.selected .resizer, .draggable-item.selected .resizer {
            display: block;
        }

        .resizer.bottom-right {
            bottom: -5px;
            right: -5px;
            cursor: se-resize;
        }
        
        .arrow-controls {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 5px;
            background: #fff;
            padding: 5px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            align-items: center;
        }

        .draggable-arrow.selected .arrow-controls, .draggable-item.selected .arrow-controls {
            display: flex;
        }

        .arrow-controls button {
            background: var(--accent-1);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 25px;
            height: 25px;
            font-family: sans-serif;
            font-weight: bold;
            font-size: 1.2rem;
            line-height: 1;
        }
        
        .arrow-controls input[type="color"] {
             width: 25px;
             height: 25px;
             padding: 1px;
             border: 1px solid #ddd;
             border-radius: 5px;
        }
         .arrow-controls input[type="color"]::-webkit-color-swatch {
             border-radius: 4px;
             border: none;
        }
         .arrow-controls input[type="color"]::-moz-color-swatch {
             border-radius: 4px;
             border: none;
        }


        .arrow-controls button.delete-arrow-btn {
            background-color: var(--accent-2);
        }
        
        /* --- NUEVO: Estilos de Autenticación y Notificaciones --- */
        
        #user-info {
            font-family: 'Kalam', cursive;
            color: var(--ink);
            font-size: 0.9rem;
            font-weight: bold;
        }

        .auth-modal {
            display: none; /* Oculto por defecto */
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .auth-modal-content {
            background-color: #fefefe;
            padding: 25px 35px;
            border: 1px solid #ddd;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            font-family: 'Kalam', cursive;
            color: #5a4b66;
            position: relative;
        }

        .auth-modal-content h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--accent-1);
            text-align: center;
        }

        .auth-form-group {
            margin-bottom: 15px;
        }

        .auth-form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        
        .auth-form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: 'Kalam', cursive;
            font-size: 1rem;
        }
        
        .auth-modal-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 20px;
        }
        .auth-modal-buttons .action-btn {
            flex: 1;
        }
        
        .close-modal-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .close-modal-btn:hover, .close-modal-btn:focus {
            color: #555;
        }
        
        #notification-toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 25px;
            border-radius: 8px;
            color: white;
            font-family: 'Kalam', cursive;
            font-size: 1.1rem;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s, bottom: 0.3s;
        }
        #notification-toast.show {
            opacity: 1;
            visibility: visible;
            bottom: 30px;
        }
        #notification-toast.success {
            background-color: #4CAF50; /* Verde */
        }
        #notification-toast.error {
            background-color: #f44336; /* Rojo */
        }

    </style>
</head>
<body>
    <div class="settings-panel">
        <div class="settings-controls-wrapper">
            <div class="control-group">
                <label for="month-selector">Mes:</label>
                <select id="month-selector"></select>
                <label for="year-input">Año:</label>
                <input type="number" id="year-input" min="1900" max="2100">
            </div>
            <div class="control-group">
                <label>Colores del Logo:</label>
                <input type="color" id="logo-color-1" title="Color 'Emilie'">
                <input type="color" id="logo-color-2" title="Color '&'">
                <input type="color" id="logo-color-3" title="Color 'Estephany'">
            </div>
            <div class="control-group">
                <label>Otros Colores:</label>
                <input type="color" id="accent-color-1" title="Color Principal">
                <input type="color" id="accent-color-2" title="Líneas y Acentos">
                <input type="color" id="paper-color" title="Color de Fondo">
                <input type="color" id="ink-color" title="Color de Texto">
            </div>
            <div class="control-group">

<script>
    document.addEventListener('DOMContentLoaded', function() {

        // 4. Ve a "SQL Editor" en Supabase y ejecuta el siguiente script para crear tu tabla:
        /*
            -- Habilita Row Level Security (¡MUY IMPORTANTE!)
            ALTER TABLE planner_data ENABLE ROW LEVEL SECURITY;

            -- Crea la tabla para guardar los datos de cada usuario
            CREATE TABLE public.planner_data (
              id UUID PRIMARY KEY REFERENCES auth.users(id) ON DELETE CASCADE,
              updated_at TIMESTAMPTZ,

            -- Crea políticas para que los usuarios solo puedan acceder a SUS PROPIOS datos
            CREATE POLICY "Los usuarios pueden insertar sus propios datos."
            ON public.planner_data FOR INSERT
            WITH CHECK (auth.uid() = id);

        // --- FIN: CONFIGURACIÓN DE SUPABASE ---

        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let currentUser = null;
        let saveTimeout;

        const controls = {

            paperColor: document.getElementById('paper-color'),
            inkColor: document.getElementById('ink-color'),
            bgImageUrl: document.getElementById('background-image-url'),
            itemUrl: document.getElementById('item-url'),
            bgOpacitySlider: document.getElementById('background-opacity-slider'),
            bgSizeSlider: document.getElementById('background-size-slider'),
            bgPosXSlider: document.getElementById('background-pos-x'),
            bgPosYSlider: document.getElementById('background-pos-y'),
            addTaskBtn: document.getElementById('addTaskBtn'),
            downloadBtn: document.getElementById('downloadBtn'),
            toggleSidebarBtn: document.getElementById('toggleSidebarBtn'),
            glowToggle: document.getElementById('glow-toggle'),
            glowIntensitySlider: document.getElementById('glow-intensity-slider'),
            addArrowBtn: document.getElementById('addArrowBtn'),
            addItemBtn: document.getElementById('addItemBtn'),
            individualNoteEditor: document.getElementById('individual-note-editor'),
            editingDayLabel: document.getElementById('editing-day-label'),
            fontSizeInput: document.getElementById('individual-font-size-input'),
            fontSizeDisplay: document.getElementById('individual-font-size-display'),
            mainPageHeightSlider: document.getElementById('main-page-height-slider'),
            showNextMonthToggle: document.getElementById('show-next-month-toggle'),
            // Auth elements
            authBtn: document.getElementById('authBtn'),
            logoutBtn: document.getElementById('logoutBtn'),
            authModal: document.getElementById('auth-modal'),
            closeModalBtn: document.querySelector('.close-modal-btn'),
            loginBtn: document.getElementById('login-btn'),
            signupBtn: document.getElementById('signup-btn'),
            authEmail: document.getElementById('auth-email'),
            authPassword: document.getElementById('auth-password'),
            userInfo: document.getElementById('user-info')
        };

        const display = {
            planner: document.getElementById('export-area'),
            monthName: document.getElementById('month-name'),
            year: document.getElementById('year-display'),
            calendarBody: document.getElementById('calendar-body'),
            todoList: document.querySelector('.task-list'),
            bgImageContainer: document.getElementById('background-image-container'),
            sidebar: document.querySelector('.sidebar'),
            elementsContainer: document.getElementById('elements-container'),
            nextMonthPage: document.getElementById('next-month-page'),
            notification: document.getElementById('notification-toast')
        };
        
        const monthData = {
            names: ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"]
        };
        let taskCounter = 0;
        let confettiInterval = null;
        let activeNoteElement = null;
        let activeDraggableElement = null;
        
        function initialize() {
            monthData.names.forEach((name, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = name;
                controls.month.appendChild(option);
            });
            
            controls.downloadBtn.disabled = true;
            controls.downloadBtn.textContent = "Cargando...";

            document.fonts.ready.then(() => {
                controls.downloadBtn.disabled = false;
                controls.downloadBtn.textContent = "Descargar PNG";
                
                // Cargar estado por defecto o esperar a login
                setDefaultState();
            });
            
            setupEventListeners();
            setupAuthListeners();
        }
        
        function setDefaultState() {
             const today = new Date();
             controls.month.value = today.getMonth();
             controls.year.value = today.getFullYear();

             const rootStyle = getComputedStyle(document.documentElement);
             controls.logoColor1.value = rootStyle.getPropertyValue('--logo-color-1').trim();
             controls.logoColor2.value = rootStyle.getPropertyValue('--logo-color-2').trim();
             controls.logoColor3.value = rootStyle.getPropertyValue('--logo-color-3').trim();
             controls.accentColor1.value = rootStyle.getPropertyValue('--accent-1').trim();
             controls.accentColor2.value = rootStyle.getPropertyValue('--accent-2').trim();
             controls.paperColor.value = rootStyle.getPropertyValue('--paper').trim();
             controls.inkColor.value = rootStyle.getPropertyValue('--ink-editable').trim();
             controls.bgOpacitySlider.value = rootStyle.getPropertyValue('--bg-opacity').trim();
             controls.bgSizeSlider.value = 100;
             controls.bgPosXSlider.value = 50;
             controls.bgPosYSlider.value = 50;
             controls.mainPageHeightSlider.value = parseInt(rootStyle.getPropertyValue('--main-page-height'));
             
             updateFullDisplay();
             
             display.todoList.innerHTML = '';
             taskCounter = 0;
             for(let i=0; i<5; i++) {
                 addTask(i === 0 ? "¡Planificar el mes!" : "...");
             }
        }

        // --- MANEJO DE AUTENTICACIÓN Y DATOS ---

        function setupAuthListeners() {
            supabaseClient.auth.onAuthStateChange((event, session) => {
                if (event === 'SIGNED_IN') {
                    currentUser = session.user;
                    updateUIForUser();
                    loadDataFromSupabase();
                } else if (event === 'SIGNED_OUT') {
                    currentUser = null;
                    updateUIForUser();
                    setDefaultState();
                }
            });
        }
        
        function updateUIForUser() {
            if (currentUser) {
                controls.authBtn.style.display = 'none';
                controls.logoutBtn.style.display = 'block';
                controls.userInfo.textContent = currentUser.email;
                controls.userInfo.style.display = 'block';
                controls.authModal.style.display = 'none';
            } else {
                controls.authBtn.style.display = 'block';
                controls.logoutBtn.style.display = 'none';
                controls.userInfo.style.display = 'none';
            }
        }

        async function handleSignup() {
            const email = controls.authEmail.value;
            const password = controls.authPassword.value;
            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            if (error) {
                showNotification(`Error: ${error.message}`, 'error');
            } else {
                showNotification('¡Registro exitoso! Revisa tu email para confirmar.', 'success');
                controls.authModal.style.display = 'none';
            }
        }
        
        async function handleLogin() {
            const email = controls.authEmail.value;
            const password = controls.authPassword.value;
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                showNotification(`Error: ${error.message}`, 'error');
            } else {
                showNotification('¡Bienvenido de vuelta!', 'success');
                controls.authModal.style.display = 'none';
            }
        }

        async function handleLogout() {
            const { error } = await supabaseClient.auth.signOut();
            if (error) {
                showNotification(`Error: ${error.message}`, 'error');
            } else {
                 showNotification('Has cerrado sesión.', 'success');
            }
        }
        
        async function loadDataFromSupabase() {
            if (!currentUser) return;

            const { data, error } = await supabaseClient
                .from('planner_data')
                .select('data')
                .eq('id', currentUser.id)
                .single();

            if (data && data.data) {
                applyConfiguration(data.data);
                showNotification('Datos cargados desde la nube.', 'success');
            } else if (error && error.code !== 'PGRST116') { // PGRST116 = no rows found
                showNotification(`Error al cargar: ${error.message}`, 'error');
            } else {
                showNotification('No se encontraron datos guardados. ¡Empecemos!', 'success');
            }
        }

        async function saveDataToSupabase() {
            if (!currentUser) {
                 showNotification('Inicia sesión para guardar en la nube.', 'error');
                return;
            }
            const configData = getCurrentConfiguration();
            
            const { data, error } = await supabaseClient
                .from('planner_data')
                .upsert({ id: currentUser.id, data: configData, updated_at: new Date() });

            if (error) {
                showNotification(`Error al guardar: ${error.message}`, 'error');
                console.error("Error saving to Supabase:", error);
            } else {
                showNotification('Guardado en la nube.', 'success');
            }
        }
        
        function triggerAutoSave() {
            if (!currentUser) return;
            showNotification('Guardando...', 'success');
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(saveDataToSupabase, 2000); // Guardar 2s después del último cambio
        }

        function showNotification(message, type = 'success') {
            display.notification.textContent = message;
            display.notification.className = ``; // Reset classes
            display.notification.classList.add('show', type);
            setTimeout(() => {
                display.notification.classList.remove('show');
            }, 3000);
        }

        // --- LÓGICA DE LA APLICACIÓN (EXISTENTE Y MODIFICADA) ---
        
        function setupEventListeners() {
            const elementsToAutosave = [
                controls.month, controls.year, controls.logoColor1, controls.logoColor2, 
                controls.logoColor3, controls.accentColor1, controls.accentColor2, 
                controls.paperColor, controls.inkColor, controls.bgImageUrl, 
                controls.bgOpacitySlider, controls.bgSizeSlider, controls.bgPosXSlider, 
                controls.bgPosYSlider, controls.glowToggle, controls.glowIntensitySlider,
                controls.mainPageHeightSlider, controls.showNextMonthToggle
            ];
            elementsToAutosave.forEach(el => {
                const eventType = (el.type === 'range' || el.type === 'color' || el.type.startsWith('text') || el.type === 'url' || el.type === 'number') ? 'input' : 'change';
                el.addEventListener(eventType, triggerAutoSave);
            });
            
            display.planner.addEventListener('input', (e) => {
                if(e.target.hasAttribute('contenteditable')) {
                    triggerAutoSave();
                }
            });

            controls.addTaskBtn.addEventListener('click', () => {
                addTask('Nueva tarea');
                triggerAutoSave();
            });
            
            display.todoList.addEventListener('click', function(e) {
                if (e.target.matches('.remove-task-btn')) {
                    e.target.closest('.task-item')?.remove();
                    triggerAutoSave();
                } else if(e.target.matches('input[type="checkbox"]')) {
                    triggerAutoSave();
                }
            });

            controls.downloadBtn.addEventListener('click', handleDownload);
            controls.toggleSidebarBtn.addEventListener('click', toggleSidebar);
            controls.addArrowBtn.addEventListener('click', () => createArrow());
            controls.addItemBtn.addEventListener('click', () => {
                const url = controls.itemUrl.value;
                if (url) {
                    createItem({ url });
                    controls.itemUrl.value = '';
                }
            });
            
            // Auth Modals
            controls.authBtn.addEventListener('click', () => controls.authModal.style.display = 'flex');
            controls.closeModalBtn.addEventListener('click', () => controls.authModal.style.display = 'none');
            window.addEventListener('click', (e) => {
                if (e.target === controls.authModal) {
                    controls.authModal.style.display = 'none';
                }
            });
            controls.loginBtn.addEventListener('click', handleLogin);
            controls.signupBtn.addEventListener('click', handleSignup);
            controls.logoutBtn.addEventListener('click', handleLogout);

            // Rest of original listeners
            controls.month.addEventListener('change', updateFullDisplay);
            controls.year.addEventListener('input', updateFullDisplay);
            controls.logoColor1.addEventListener('input', () => updateCssVariable('--logo-color-1', controls.logoColor1.value));
            controls.logoColor2.addEventListener('input', () => updateCssVariable('--logo-color-2', controls.logoColor2.value));
            controls.logoColor3.addEventListener('input', () => updateCssVariable('--logo-color-3', controls.logoColor3.value));
            controls.accentColor1.addEventListener('input', () => updateCssVariable('--accent-1', controls.accentColor1.value));
            controls.accentColor2.addEventListener('input', () => {
                const colorValue = controls.accentColor2.value;
                updateCssVariable('--accent-2', colorValue);
                const rgb = hexToRgb(colorValue);
                if (rgb) {
                    updateCssVariable('--grid-line', `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.3)`);
                }
            });
            controls.paperColor.addEventListener('input', () => updateCssVariable('--paper', controls.paperColor.value));
            controls.inkColor.addEventListener('input', () => updateCssVariable('--ink-editable', controls.inkColor.value));
            controls.bgImageUrl.addEventListener('input', (e) => (display.bgImageContainer.style.backgroundImage = `url(${e.target.value})`));
            controls.bgOpacitySlider.addEventListener('input', (e) => updateCssVariable('--bg-opacity', e.target.value));
            controls.bgSizeSlider.addEventListener('input', (e) => updateCssVariable('--bg-size', `${e.target.value}%`));
            controls.bgPosXSlider.addEventListener('input', (e) => updateCssVariable('--bg-pos-x', `${e.target.value}%`));
            controls.bgPosYSlider.addEventListener('input', (e) => updateCssVariable('--bg-pos-y', `${e.target.value}%`));
            controls.mainPageHeightSlider.addEventListener('input', (e) => updateCssVariable('--main-page-height', `${e.target.value}vh`));
            
            // ** BUG FIX: Changed listener to be non-destructive **
            controls.showNextMonthToggle.addEventListener('change', () => {
                updateNextMonthView();
                triggerAutoSave();
            });

            // ** SYNTAX FIX START **
            // The previous version had a corrupted block here.
            // Restoring the correct event listeners that were missing or broken.

            controls.glowToggle.addEventListener('change', (e) => {
                document.body.classList.toggle('glow-mode', e.target.checked);
                triggerAutoSave();
            });
            
            controls.glowIntensitySlider.addEventListener('input', (e) => {
                updateCssVariable('--glow-intensity', e.target.value);
                triggerAutoSave();
            });
            
            document.getElementById('calendar-wrapper').addEventListener('focusin', (e) => {
                if (e.target.classList.contains('note')) {
                    handleNoteFocus(e.target);
                }
            });

            controls.fontSizeInput.addEventListener('input', (e) => {
                if (activeNoteElement) {
                    const newSize = e.target.value;
                    activeNoteElement.style.fontSize = `${newSize}px`;
                    controls.fontSizeDisplay.textContent = `${newSize}px`;
                    triggerAutoSave();
                }
            });
            
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.draggable-arrow, .draggable-item')) {
                    deselectAllElements();
                }
            });
            // ** SYNTAX FIX END **
        }
        
        // ** BUG FIX: Extracted logic to its own function **
        function updateNextMonthView() {
            const mainPage = document.getElementById('main-page');
            const year = parseInt(controls.year.value);
            const month = parseInt(controls.month.value);
            if (isNaN(year) || isNaN(month)) return;

            if (controls.showNextMonthToggle.checked) {
                mainPage.classList.add('with-next-month');
                display.nextMonthPage.style.display = 'block';
                const nextMonthDate = new Date(year, month + 1, 1);
                const nextMonth = nextMonthDate.getMonth();
                const nextYear = nextMonthDate.getFullYear();
                renderNextMonth(nextYear, nextMonth);
            } else {
                mainPage.classList.remove('with-next-month');
                display.nextMonthPage.style.display = 'none';
                display.nextMonthPage.innerHTML = '';
            }
        }

        function handleNoteFocus(noteElement) {
            activeNoteElement = noteElement;
            const dayNumber = activeNoteElement.closest('td').querySelector('.day-number').textContent;
            const currentSize = parseInt(window.getComputedStyle(noteElement).fontSize) || 14;
            
            controls.editingDayLabel.textContent = `Fuente (Día ${dayNumber}):`;
            controls.fontSizeInput.value = currentSize;
            controls.fontSizeDisplay.textContent = `${currentSize}px`;
            controls.individualNoteEditor.style.display = 'flex';
        }

        function updateFullDisplay() {
            if (confettiInterval) {
                clearInterval(confettiInterval);
                confettiInterval = null;
            }
            const year = parseInt(controls.year.value);
            const month = parseInt(controls.month.value);
            if (isNaN(year) || isNaN(month)) return;

            // Generate main calendar
            display.monthName.textContent = monthData.names[month].toUpperCase();
            display.year.textContent = year;
            generateCalendar(year, month);

            // ** BUG FIX: Call new function to update next month view **
            updateNextMonthView();
        }

        function generateCalendar(year, month) {
            display.calendarBody.innerHTML = '';
            const firstDay = new Date(year, month, 1);
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            let startingDay = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1; 
            
            let date = 1;
            let row = document.createElement('tr');
            display.calendarBody.appendChild(row);

            for (let i = 0; i < startingDay; i++) {
                const cell = document.createElement('td');
                cell.classList.add('empty-day');
                row.appendChild(cell);
            }

            while (date <= daysInMonth) {
                if (row.children.length === 7) {
                    row = document.createElement('tr');
                    display.calendarBody.appendChild(row);
                }

                const cell = document.createElement('td');
                let noteContent = '';
                let cellHTML = `<div class="day-number">${date}</div>`;
                
                const currentDayOfWeek = new Date(year, month, date).getDay();
                if ([1, 3, 5, 6].includes(currentDayOfWeek)) { // L, X, V, S
                    cellHTML += `<div class="stream-time">Stream 5:30pm MX</div>`;
                }
                
                if (month === 9 && date === 25) { // Cumpleaños en Octubre 25
                    cell.classList.add('epic-frame');
                    cellHTML += '<canvas class="confetti-canvas"></canvas>';
                }

                cellHTML += `<div class="note" contenteditable="true">${noteContent}</div>`;
                cell.innerHTML = cellHTML;

                row.appendChild(cell);
                date++;
            }
            
            while (row.children.length > 0 && row.children.length < 7) {
                 const cell = document.createElement('td');
                 cell.classList.add('empty-day');
                 row.appendChild(cell);
            }
            
            if (month === 9) { // Octubre
                const birthdayCell = display.calendarBody.querySelector('.epic-frame');
                if (birthdayCell) {
                    startBirthdayConfetti(birthdayCell);
                }
            }
        }
        
        function renderNextMonth(year, month) {
            let nextMonthHTML = `
                <div class="page-content-wrapper">
                    <div class="month-header">
                        <div class="month-year-container" style="width: 100%; text-align: right;">
                            <div class="month-name">${monthData.names[month].toUpperCase()}</div>
                            <div class="year">${year}</div>
                        </div>
                    </div>
                    <table class="calendar">
                        <thead><tr><th>L</th><th>M</th><th>X</th><th>J</th><th>V</th><th>S</th><th>D</th></tr></thead>
                        <tbody id="calendar-body-next"></tbody>
                    </table>
                </div>
            `;
            display.nextMonthPage.innerHTML = nextMonthHTML;

            const calendarBodyNext = display.nextMonthPage.querySelector('#calendar-body-next');
            const firstDay = new Date(year, month, 1);
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            let startingDay = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;

            let date = 1;
            let row = document.createElement('tr');
            calendarBodyNext.appendChild(row);

            for (let i = 0; i < startingDay; i++) {
                const cell = document.createElement('td');
                cell.classList.add('empty-day');
                row.appendChild(cell);
            }

            while (date <= daysInMonth) {
                if (row.children.length === 7) {
                    row = document.createElement('tr');
                    calendarBodyNext.appendChild(row);
                }

                const cell = document.createElement('td');
                let cellHTML = `<div class="day-number">${date}</div>`;
                const currentDayOfWeek = new Date(year, month, date).getDay();
                if ([1, 3, 5, 6].includes(currentDayOfWeek)) {
                    cellHTML += `<div class="stream-time">Stream 5:30pm MX</div>`;
                }
                 cellHTML += '<div class="note" contenteditable="true"></div>';
                 cell.innerHTML = cellHTML;
                row.appendChild(cell);
                date++;
            }

            while (row.children.length > 0 && row.children.length < 7) {
                const cell = document.createElement('td');
                cell.classList.add('empty-day');
                row.appendChild(cell);
            }
        }

        function startBirthdayConfetti(targetCell) {
            if (confettiInterval || !targetCell) return;
            const canvas = targetCell.querySelector('.confetti-canvas');
            if (!canvas) return;

            const myConfetti = confetti.create(canvas, {
                resize: true,
                useWorker: false
            });

            const defaults = {
                spread: 360,
                ticks: 100,
                gravity: 0.1,
                decay: 0.98,
                startVelocity: 10,
                zIndex: 10,
            };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            confettiInterval = setInterval(function() {
                const particleCount = 10;
                const colors = [controls.logoColor1.value, controls.logoColor2.value, controls.logoColor3.value, '#ffd700'];
                
                myConfetti(Object.assign({}, defaults, {
                    particleCount,
                    origin: { x: randomInRange(0.1, 0.9), y: Math.random() - 0.2 },
                    colors: colors
                }));
            }, 800);
        }


        function updateCssVariable(variable, value) {
            document.documentElement.style.setProperty(variable, value);
        }
        
        function hexToRgb(hex) {
            let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        function addTask(text, isChecked = false) {
            taskCounter++;
            const newLi = document.createElement('li');
            newLi.classList.add('task-item');
            newLi.innerHTML = `<input type="checkbox" id="task${taskCounter}"> <span contenteditable="true">${text}</span><button class="remove-task-btn" title="Quitar tarea">×</button>`;
            newLi.querySelector('input[type="checkbox"]').checked = isChecked;
            display.todoList.appendChild(newLi);
        }
        
        function handleDownload() {
            deselectAllElements();
            const downloadButton = controls.downloadBtn;
            downloadButton.textContent = "Generando...";
            downloadButton.disabled = true;

            setTimeout(() => {
                if (confettiInterval) clearInterval(confettiInterval);
                
                html2canvas(document.getElementById('export-area'), {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--paper').trim(),
                    onclone: (clonedDoc) => {
                        const activeElement = clonedDoc.activeElement;
                        if(activeElement && activeElement.blur) {
                            activeElement.blur();
                        }
                    }
                })
                .then(canvas => {
                    const link = document.createElement('a');
                    link.download = `planificador-${controls.year.value}-${monthData.names[controls.month.value]}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    downloadButton.textContent = "Descargar PNG";
                    downloadButton.disabled = false;
                    updateFullDisplay();
                }).catch(err => {
                    console.error("Error al generar el canvas: ", err);
                    downloadButton.textContent = "Error";
                    setTimeout(() => { 
                        downloadButton.textContent = "Descargar PNG"; 
                        downloadButton.disabled = false; 
                    }, 2000);
                     updateFullDisplay();
                });
            }, 500);
        }
        
        function toggleSidebar() {
            const isHidden = display.sidebar.style.display === 'none';
            display.sidebar.style.display = isHidden ? '' : 'none';
            controls.toggleSidebarBtn.textContent = isHidden ? 'Ocultar Panel' : 'Mostrar Panel';
        }
        
        function updateElementTransform(element) {
            const rot = element.dataset.rotation || '0';
            const sx = element.dataset.scaleX || '1';
            const sy = element.dataset.scaleY || '1';
            element.style.transform = `rotate(${rot}deg) scale(${sx}, ${sy})`;
        }
        
        /**
         * Carga un SVG externo y lo inserta dentro de un <svg> destino
         */
        async function injectExternalSVG(destSvg, url, forceColor) {
            const res = await fetch(url, { mode: "cors" });
            if (!res.ok) throw new Error(`Failed to fetch SVG: ${res.statusText}`);
            const text = await res.text();

            const parser = new DOMParser();
            const doc = parser.parseFromString(text, "image/svg+xml");
            const extSvg = doc.documentElement;
            
            if (extSvg.tagName.toLowerCase() === 'html') { // Error parsing SVG
                 throw new Error("Parsed content is not SVG. Check URL or CORS policy.");
            }

            const vb = extSvg.getAttribute("viewBox");
            destSvg.setAttribute("viewBox", vb || destSvg.getAttribute("viewBox") || "0 0 1024 1024");

            while (destSvg.firstChild) destSvg.removeChild(destSvg.firstChild);
            
            const nodesToCopy = [...extSvg.childNodes].filter(n => n.nodeType === 1); // ELEMENT_NODE
            nodesToCopy.forEach(n => destSvg.appendChild(destSvg.ownerDocument.importNode(n, true)));
            
            if (forceColor) {
                destSvg.querySelectorAll('path').forEach(p => p.classList.add('arrow-path'));
            }

            if (!destSvg.hasAttribute('preserveAspectRatio')) {
                destSvg.setAttribute('preserveAspectRatio', 'none');
            }
        }

        async function createArrow(config = {}) {
            const arrowWrapper = document.createElement('div');
            arrowWrapper.className = 'draggable-arrow';
            arrowWrapper.style.left = config.left || '50px';
            arrowWrapper.style.top = config.top || '50px';
            arrowWrapper.style.width = config.width || '150px';
            arrowWrapper.style.height = config.height || '150px';

            arrowWrapper.dataset.rotation = config.rotation || '0';
            arrowWrapper.dataset.scaleX = config.scaleX || '1';
            arrowWrapper.dataset.scaleY = config.scaleY || '1';
            updateElementTransform(arrowWrapper);

            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, 'svg');
            svg.setAttribute('viewBox', '0 0 1024 1024');
            svg.setAttribute('preserveAspectRatio', 'none');
            arrowWrapper.appendChild(svg);
            
            const ARROW_URL = 'https://raw.githubusercontent.com/JoarviKirby/kjh87sdfg-assets/refs/heads/main/Arrow.svg';

            try {
                await injectExternalSVG(svg, ARROW_URL, true);
            } catch (e) {
                console.error('No se pudo cargar Arrow.svg, usando path fallback:', e);
                const path = document.createElementNS(svgNS, 'path');
                path.setAttribute('d', 'M100 900 L900 512 L100 124 Z'); // Triángulo simple como fallback
                path.classList.add('arrow-path');
                svg.appendChild(path);
            }

            const resizer = document.createElement('div');
            resizer.className = 'resizer bottom-right';

            const controlsDiv = document.createElement('div');
            controlsDiv.className = 'arrow-controls';
            controlsDiv.innerHTML = `<button title="Girar Izquierda">↺</button><button title="Girar Derecha">↻</button><button title="Flip Horizontal">↔</button><button title="Flip Vertical">↕</button><input type="color" class="color-picker" title="Cambiar Color" style="display: none;"><button title="Eliminar" class="delete-arrow-btn">×</button>`;

            arrowWrapper.appendChild(resizer);
            arrowWrapper.appendChild(controlsDiv);
            
            makeDraggable(arrowWrapper);
            makeResizable(arrowWrapper, resizer);
            setupElementControls(arrowWrapper, controlsDiv);
            
            display.elementsContainer.appendChild(arrowWrapper);
            selectElement(arrowWrapper);
            triggerAutoSave();
        }

        async function createItem(config = {}) {
            if (!config.url) return;

            const itemWrapper = document.createElement('div');
            itemWrapper.className = 'draggable-item';
            itemWrapper.dataset.url = config.url; 

            itemWrapper.style.left = config.left || '75px';
            itemWrapper.style.top = config.top || '75px';
            itemWrapper.style.width = config.width || '100px';
            itemWrapper.style.height = config.height || '100px';

            itemWrapper.dataset.rotation = config.rotation || '0';
            itemWrapper.dataset.scaleX   = config.scaleX   || '1';
            itemWrapper.dataset.scaleY   = config.scaleY   || '1';
            
            if (config.color) {
                itemWrapper.style.color = config.color;
                itemWrapper.classList.add('color-override');
            }

            updateElementTransform(itemWrapper); 

            if (config.url.toLowerCase().endsWith('.svg')) {
                const svg = document.createElementNS("http://www.w3.org/2000/svg", 'svg');
                itemWrapper.appendChild(svg);
                try {
                    await injectExternalSVG(svg, config.url, false); 
                } catch (e) {
                    console.error('Failed to load SVG item:', e);
                    showNotification('Error al cargar SVG. Revisa la URL y CORS.', 'error');
                    itemWrapper.remove(); 
                    return;
                }
            } else { 
                const img = document.createElement('img');
                // ** BUG FIX: Set crossOrigin *before* setting the src to ensure the browser sends the correct CORS headers for the image request. **
                img.crossOrigin = "anonymous";
                img.src = config.url;
                img.onerror = () => { 
                    console.error('Failed to load image item:', config.url);
                     showNotification('Error al cargar imagen. Revisa la URL.', 'error');
                    itemWrapper.remove();
                };
                itemWrapper.appendChild(img);
            }
            
            const resizer = document.createElement('div');
            resizer.className = 'resizer bottom-right';

            const controlsDiv = document.createElement('div');
            controlsDiv.className = 'arrow-controls';
            controlsDiv.innerHTML = `<button title="Girar Izquierda">↺</button><button title="Girar Derecha">↻</button><button title="Flip Horizontal">↔</button><button title="Flip Vertical">↕</button><input type="color" class="color-picker" title="Cambiar Color"><button title="Eliminar" class="delete-arrow-btn">×</button>`;

            itemWrapper.appendChild(resizer);
            itemWrapper.appendChild(controlsDiv);
            
            makeDraggable(itemWrapper);
            makeResizable(itemWrapper, resizer);
            setupElementControls(itemWrapper, controlsDiv); 
            
            display.elementsContainer.appendChild(itemWrapper);
            selectElement(itemWrapper);
            triggerAutoSave();
        }
        
        function makeDraggable(element) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            element.onmousedown = dragMouseDown;

            function dragMouseDown(e) {
                if (e.target.classList.contains('resizer') || e.target.closest('.arrow-controls')) return;
                e.preventDefault();
                selectElement(element);
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function elementDrag(e) {
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                element.style.top = (element.offsetTop - pos2) + "px";
                element.style.left = (element.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
                triggerAutoSave();
            }
        }

        function makeResizable(element, resizer) {
            let original_width = 0, original_height = 0, original_x = 0, original_y = 0;
            resizer.onmousedown = function(e) {
                e.preventDefault();
                e.stopPropagation();
                original_width = parseFloat(getComputedStyle(element, null).getPropertyValue('width').replace('px', ''));
                original_height = parseFloat(getComputedStyle(element, null).getPropertyValue('height').replace('px', ''));
                original_x = e.clientX;
                original_y = e.clientY;
                window.onmousemove = resize;
                window.onmouseup = stopResize;
            }
            
            function resize(e) {
                const width = original_width + (e.clientX - original_x);
                const height = original_height + (e.clientY - original_y);
                if (width > 30) element.style.width = width + 'px';
                if (height > 30) element.style.height = height + 'px';
            }
            
            function stopResize() {
                window.onmousemove = null;
                window.onmouseup = null;
                triggerAutoSave();
            }
        }
        
        function setupElementControls(element, controlsDiv) {
            const rotateLeftBtn = controlsDiv.children[0];
            const rotateRightBtn = controlsDiv.children[1];
            const flipHBtn = controlsDiv.children[2];
            const flipVBtn = controlsDiv.children[3];
            const colorPicker = controlsDiv.children[4];
            const deleteBtn = controlsDiv.children[5];
            
            const actionWithSave = (action) => (e) => {
                e.stopPropagation();
                action();
                triggerAutoSave();
            };

            rotateLeftBtn.onclick = actionWithSave(() => {
                let rot = parseFloat(element.dataset.rotation) || 0;
                element.dataset.rotation = rot - 15;
                updateElementTransform(element);
            });

            rotateRightBtn.onclick = actionWithSave(() => {
                let rot = parseFloat(element.dataset.rotation) || 0;
                element.dataset.rotation = rot + 15;
                updateElementTransform(element);
            });

            flipHBtn.onclick = actionWithSave(() => {
                let sx = parseFloat(element.dataset.scaleX) || 1;
                element.dataset.scaleX = sx * -1;
                updateElementTransform(element);
            });
            
            flipVBtn.onclick = actionWithSave(() => {
                let sy = parseFloat(element.dataset.scaleY) || 1;
                element.dataset.scaleY = sy * -1;
                updateElementTransform(element);
            });

            colorPicker.oninput = (e) => {
                e.stopPropagation();
                if (element.classList.contains('draggable-item')) {
                    element.classList.add('color-override');
                    element.style.color = e.target.value;
                }
                 triggerAutoSave();
            };
            colorPicker.onclick = (e) => e.stopPropagation();

            deleteBtn.onclick = actionWithSave(() => {
                element.remove();
            });
        }

        function selectElement(element) {
            deselectAllElements();
            activeDraggableElement = element;
            element.classList.add('selected');
        }

        function deselectAllElements() {
            document.querySelectorAll('.draggable-arrow.selected, .draggable-item.selected').forEach(el => el.classList.remove('selected'));
            activeDraggableElement = null;
        }

        function getCurrentConfiguration() {
            const notes = {};
            document.querySelectorAll('#main-page .calendar td:not(.empty-day)').forEach(cell => {
                const day = cell.querySelector('.day-number').textContent;
                const noteEl = cell.querySelector('.note');
                const noteHTML = noteEl.innerHTML;
                const noteFontSize = noteEl.style.fontSize; 

                if ((noteHTML && noteHTML.trim() !== '') || noteFontSize) {
                    notes[day] = {
                        html: noteHTML,
                        fontSize: noteFontSize || ''
                    };
                }
            });

            // ** BUG FIX: Add logic to save notes from the next month view **
            const nextMonthNotes = {};
            if (controls.showNextMonthToggle.checked) {
                document.querySelectorAll('#next-month-page .calendar td:not(.empty-day)').forEach(cell => {
                    const day = cell.querySelector('.day-number').textContent;
                    const noteEl = cell.querySelector('.note');
                    const noteHTML = noteEl.innerHTML;
                    const noteFontSize = noteEl.style.fontSize;

                    if ((noteHTML && noteHTML.trim() !== '') || noteFontSize) {
                        nextMonthNotes[day] = {
                            html: noteHTML,
                            fontSize: noteFontSize || ''
                        };
                    }
                });
            }

            const tasks = [];
            document.querySelectorAll('.task-item').forEach(item => {
                tasks.push({
                    text: item.querySelector('span').innerHTML,
                    checked: item.querySelector('input[type="checkbox"]').checked
                });
            });
            
            const elements = [];
            document.querySelectorAll('.draggable-arrow, .draggable-item').forEach(el => {
                const isArrow = el.classList.contains('draggable-arrow');
                const elementData = {
                    type: isArrow ? 'arrow' : 'item',
                    left: el.style.left,
                    top: el.style.top,
                    width: el.style.width,
                    height: el.style.height,
                    rotation: el.dataset.rotation,
                    scaleX: el.dataset.scaleX,
                    scaleY: el.dataset.scaleY,
                };
                if (!isArrow) {
                    elementData.url = el.dataset.url;
                    elementData.color = el.style.color || '';
                }
                elements.push(elementData);
            });

            return {
                version: 6,
                month: controls.month.value,
                year: controls.year.value,
                monthName: display.monthName.textContent,
                yearDisplay: display.year.textContent,
                tasksHeader: document.querySelector('.tasks-header').textContent,
                glowMode: controls.glowToggle.checked,
                glowIntensity: controls.glowIntensitySlider.value,
                styles: {
                    logoColor1: controls.logoColor1.value,
                    logoColor2: controls.logoColor2.value,
                    logoColor3: controls.logoColor3.value,
                    accentColor1: controls.accentColor1.value,
                    accentColor2: controls.accentColor2.value,
                    paperColor: controls.paperColor.value,
                    inkColor: controls.inkColor.value,
                },
                background: {
                    url: controls.bgImageUrl.value,
                    opacity: controls.bgOpacitySlider.value,
                    size: controls.bgSizeSlider.value,
                    posX: controls.bgPosXSlider.value,
                    posY: controls.bgPosYSlider.value
                },
                mainPageHeight: controls.mainPageHeightSlider.value,
                showNextMonth: controls.showNextMonthToggle.checked,
                content: {
                    notes: notes,
                    nextMonthNotes: nextMonthNotes,
                    tasks: tasks,
                    elements: elements
                }
            };
        }
        
        function applyConfiguration(config) {
            controls.month.value = config.month;
            controls.year.value = config.year;
            controls.logoColor1.value = config.styles.logoColor1;
            controls.logoColor2.value = config.styles.logoColor2;
            controls.logoColor3.value = config.styles.logoColor3;
            controls.accentColor1.value = config.styles.accentColor1;
            controls.accentColor2.value = config.styles.accentColor2;
            controls.paperColor.value = config.styles.paperColor;
            controls.inkColor.value = config.styles.inkColor;

            controls.bgImageUrl.value = config.background.url;
            controls.bgOpacitySlider.value = config.background.opacity;
            controls.bgSizeSlider.value = config.background.size;
            controls.bgPosXSlider.value = config.background.posX;
            controls.bgPosYSlider.value = config.background.posY;

            controls.glowToggle.checked = config.glowMode || false;
            document.body.classList.toggle('glow-mode', controls.glowToggle.checked);
            
            controls.glowIntensitySlider.value = config.glowIntensity || 1;
            updateCssVariable('--glow-intensity', controls.glowIntensitySlider.value);

            controls.mainPageHeightSlider.value = config.mainPageHeight || 85;
            updateCssVariable('--main-page-height', `${controls.mainPageHeightSlider.value}vh`);
            
            controls.showNextMonthToggle.checked = config.showNextMonth || false;

            updateCssVariable('--logo-color-1', config.styles.logoColor1);
            updateCssVariable('--logo-color-2', config.styles.logoColor2);
            updateCssVariable('--logo-color-3', config.styles.logoColor3);
            updateCssVariable('--accent-1', config.styles.accentColor1);
            updateCssVariable('--accent-2', config.styles.accentColor2);
            updateCssVariable('--paper', config.styles.paperColor);
            updateCssVariable('--ink-editable', config.styles.inkColor);

            const rgb = hexToRgb(config.styles.accentColor2);
            if (rgb) {
                updateCssVariable('--grid-line', `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.3)`);
            }

            display.bgImageContainer.style.backgroundImage = `url(${config.background.url})`;
            updateCssVariable('--bg-opacity', config.background.opacity);
            updateCssVariable('--bg-size', `${config.background.size}%`);
            updateCssVariable('--bg-pos-x', `${config.background.posX}%`);
            updateCssVariable('--bg-pos-y', `${config.background.posY}%`);

            updateFullDisplay();

            setTimeout(() => {
                display.todoList.innerHTML = '';
                taskCounter = 0;
                display.elementsContainer.innerHTML = '';

                if (config.content && config.content.notes) {
                    Object.keys(config.content.notes).forEach(day => {
                        const cell = Array.from(document.querySelectorAll('#main-page .calendar td .day-number'))
                                       .find(el => el.textContent === day)?.closest('td');
                        if (cell) {
                            const noteEl = cell.querySelector('.note');
                            if(noteEl) {
                                const noteData = config.content.notes[day];
                                if (typeof noteData === 'object' && noteData !== null) {
                                    noteEl.innerHTML = noteData.html || '';
                                    if (noteData.fontSize) {
                                        noteEl.style.fontSize = noteData.fontSize;
                                    }
                                } else {
                                    noteEl.innerHTML = noteData;
                                }
                            }
                        }
                    });
                }
                
                // ** BUG FIX: Add logic to load notes for the next month view **
                if (controls.showNextMonthToggle.checked && config.content && config.content.nextMonthNotes) {
                    Object.keys(config.content.nextMonthNotes).forEach(day => {
                        const cell = Array.from(document.querySelectorAll('#next-month-page .calendar td .day-number'))
                                           .find(el => el.textContent === day)?.closest('td');
                        if (cell) {
                            const noteEl = cell.querySelector('.note');
                            if(noteEl) {
                                const noteData = config.content.nextMonthNotes[day];
                                if (typeof noteData === 'object' && noteData !== null) {
                                    noteEl.innerHTML = noteData.html || '';
                                    if (noteData.fontSize) {
                                        noteEl.style.fontSize = noteData.fontSize;
                                    }
                                } else {
                                    noteEl.innerHTML = noteData;
                                }
                            }
                        }
                    });
                }
                
                if (config.content && config.content.tasks) {
                    config.content.tasks.forEach(task => addTask(task.text, task.checked));
                }
                
                if (config.content && config.content.elements) {
                    config.content.elements.forEach(elementConfig => {
                        if (elementConfig.type === 'arrow') {
                            createArrow(elementConfig);
                        } else if (elementConfig.type === 'item') {
                            createItem(elementConfig);
                        }
                    });
                } else if (config.content && config.content.arrows) { // Backward compatibility
                     config.content.arrows.forEach(arrowConfig => createArrow(arrowConfig));
                }

                if (config.monthName) display.monthName.textContent = config.monthName;
                if (config.yearDisplay) display.year.textContent = config.yearDisplay;
                if (config.tasksHeader) document.querySelector('.tasks-header').textContent = config.tasksHeader;
                deselectAllElements();
            }, 200);
        }

        initialize();
    });
</script>
